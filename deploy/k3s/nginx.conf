worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        error_page 503 =503 @maintenance;

        location = /healthz { access_log off; default_type text/plain; return 200 'ready\n'; }
        location = /build-info.json { add_header Cache-Control no-store always; try_files $uri =404; }
        location = /api { default_type application/json; return 404 '{"code":"API_ROUTE_MISMATCH"}'; }
        location ^~ /api/ { default_type application/json; return 404 '{"code":"API_ROUTE_MISMATCH"}'; }
        location = /GeekDash.html { rewrite ^ /index.html last; }
        location = /chip-statistics.html { return 302 /project-status-summary.html$is_args$args; }
        location /assets/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location / {
            if (-f /run/geekdash-maintenance/enabled) { return 503; }
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri $uri/ =404;
        }
        location @maintenance {
            default_type text/html;
            add_header Cache-Control no-store always;
            add_header Retry-After 60 always;
            add_header X-GeekDash-Maintenance on always;
            return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeekDash 更新中</title><body style="margin:0;background:#faf6ee;color:#3c3428;font:18px/1.8 system-ui,sans-serif"><main style="max-width:640px;margin:15vh auto;padding:32px"><h1>GeekDash 正在更新</h1><p>暂时无法使用，请稍后重新打开页面。</p><p>已打开页面中的未保存内容请先保留，不要关闭。</p></main></body></html>';
        }
        location ~ /\. { deny all; }
    }
}
