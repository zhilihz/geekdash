server {
    listen 80;
    listen [::]:80;
    server_name geekdash.zhiluan.cool;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/geekdash/acme-webroot;
        try_files $uri =404;
    }
    location / { return 308 https://geekdash.zhiluan.cool$request_uri; }
}
server {
    listen 443 ssl;
    server_name geekdash.zhiluan.cool;
    ssl_certificate /etc/letsencrypt/live/geekdash.zhiluan.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geekdash.zhiluan.cool/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/geekdash.access.log;
    error_log /var/log/nginx/geekdash.error.log;
    location = /api/events {
        proxy_pass http://127.0.0.1:41860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:41860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
