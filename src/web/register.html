<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeekDash · 注册账号</title></head><body><main class="page auth-page"><header><h1>GeekDash</h1><p>创建你的账号</p></header><form id="register" class="detail-section auth-panel"><h2>注册账号</h2><label>登录名<input name="loginName" autocomplete="username" pattern="[a-z0-9][a-z0-9_-]{2,63}" required minlength="3" maxlength="64" placeholder="3～64位小写字母、数字、下划线或短横线"></label><label>姓名<input name="name" autocomplete="name" required maxlength="128"></label><label>密码<input name="password" type="password" autocomplete="new-password" required></label><p class="read-label">至少8个字符，数字、大写字母、小写字母、特殊字符中至少包含两类。</p><label>邀请码<input name="inviteCode" autocomplete="off" required maxlength="32"></label><p class="read-label">填写管理员提供的邀请码，有效期7天。</p><button class="save-btn" type="submit">注册</button><p id="register-message" role="status"></p><a class="back-btn" href="/login.html">已有账号，去登录</a></form></main><script type="module" src="/register.ts"></script></body></html>
