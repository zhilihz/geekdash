<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GeekDash 项目看板</title></head>
<body class="board-page"><main class="page">
  <header class="board-header"><a class="board-brand" href="/">GeekDash</a><div class="head-actions"><div class="view-switch theme-switch"><button data-theme="dark">深色</button><button data-theme="light">浅色</button><button data-theme="warm">暖色</button></div><a class="head-btn" href="/project-status-summary.html">项目状态简要</a><a class="head-btn" href="/imports.html">导入项目</a><a class="head-btn" href="/data-manage.html">资料与设置</a></div></header>
<div class="date-zone" id="date-zone"></div>
  <section class="board-check-entry" aria-labelledby="check-heading"><div><h2 id="check-heading">项目检查</h2><p id="today-check-count">正在读取本人项目的检查情况…</p></div><a class="board-primary" id="check-entry" href="/project-checks.html?view=all&checkToday=unchecked">进入项目检查</a></section>
  <nav class="board-views" aria-label="项目视图">
    <div class="board-view-group" role="group" aria-labelledby="project-scope-label"><span class="board-view-label" id="project-scope-label">项目范围</span><div class="view-switch"><button data-view="active">进行中</button><button data-view="proposal">提案 / 暂缓</button><button data-view="closed">已结案</button><button data-view="maintenance">量产维护</button><button data-view="all">全部项目</button></div></div>
    <div class="board-view-group board-layout-group" role="group" aria-labelledby="project-layout-label"><span class="board-view-label" id="project-layout-label">展示方式</span><div class="view-switch"><button class="active" id="layout-cards" aria-pressed="true">卡片</button><button id="layout-toggle" aria-pressed="false">驾驶舱</button></div></div>
  </nav>
  <section class="toolbar-panel" aria-label="搜索和筛选"><label class="read-label" for="search">搜索项目</label><input id="search" type="search" maxlength="255" placeholder="项目名称 / 客户 / 芯片 / 人员"><div class="filter-head"><button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-rows">▸ 展开筛选</button><span class="filter-head-hint">全部筛选条件</span><button class="head-btn" id="clear">清空筛选</button></div><div id="selected-filters" aria-label="已选条件" hidden></div><div id="filter-rows" hidden></div></section>
  <div class="board-result"><p id="result-count" aria-live="polite"></p><details class="board-more"><summary>查看统计</summary><div class="board-stat-line"><div class="stats" id="stats-bar"></div><div class="stats" id="extra-stats"></div></div></details></div>
  <p class="read-message" id="message" role="status" aria-live="polite">正在读取项目…</p>
  <section id="cards-view"><div class="board-list-heading"><h2>项目列表</h2><a class="board-primary" href="/project-new.html">新建项目</a></div><div class="grid" id="card-grid" aria-busy="true"></div><div class="read-pagination"><button class="head-btn" id="previous" disabled>上一页</button><span id="page-info"></span><button class="head-btn" id="next" disabled>下一页</button></div></section>
  <section id="dashboard-view" aria-label="项目驾驶舱" hidden><div class="chart-grid" id="chart-grid"><section class="chart-card pp-card"><h2>重点项目进度</h2><p class="pp-subtitle" id="focus-count"></p><div class="pp-list" id="focus-projects"></div></section><section class="chart-card"><h2>每人负责项目数</h2><p class="pp-subtitle">当前可见及筛选范围 · 多人协作项目分别计入</p><div id="manager-project-counts"></div></section></div><section class="board-distribution-section"><div class="distribution-heading"><h2>项目分布</h2><div id="distribution-options" class="distribution-options" aria-label="选择展示的分布"></div></div><div id="distribution-charts" class="distribution-charts"></div></section><section class="chart-card board-latest"><h2>最新状态</h2><p class="pp-subtitle">当前筛选范围 · 按项目更新时间排列</p><div id="latest-status"></div></section></section>
</main><script type="module" src="/board.ts"></script></body></html>
