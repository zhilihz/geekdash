<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GeekDash 项目看板</title></head>
<body><div class="page">
  <div class="top-sticky"><header><div class="head-left"><h1>智能硬件项目看板系统 <span class="app-version">GeekDash</span></h1><p>项目、阶段与业务资料</p></div><div class="head-actions"><div class="view-switch theme-switch"><button data-theme="dark">深色</button><button data-theme="light">浅色</button><button data-theme="warm">暖色</button></div><button class="head-btn" id="reload">刷新数据</button></div></header></div>
<div class="date-zone" id="date-zone"></div>
  <nav class="view-switch" aria-label="项目视图"><button data-view="active">进行中</button><button data-view="proposal">提案 / 暂缓</button><button data-view="closed">已结案</button><button data-view="maintenance">量产维护</button><button data-view="all">全部项目</button><a class="head-btn" href="/project-new.html">＋ 新建项目</a><button class="head-btn" id="layout-toggle">切换驾驶舱</button><details class="read-nav-menu"><summary class="head-btn">系统管理 ▾</summary><a class="head-btn" href="/settings.html">公共检查规则</a></details></nav>
  <div class="stats" id="stats-bar"></div><details class="board-more"><summary>其他统计</summary><div class="stats" id="extra-stats"></div></details><details class="chart-card board-latest"><summary>所有项目最新状态 <span class="pp-subtitle">当前筛选 · 按项目更新时间排列</span></summary><div id="latest-status"></div></details><section class="chart-grid" id="chart-grid"><div class="chart-card pp-card"><h2>重点项目进度 <span class="pp-subtitle" id="focus-count"></span></h2><div class="pp-list" id="focus-projects"></div></div><div class="chart-card"><h2>团队成员负载</h2><div id="team-load"></div><p class="pp-subtitle">全体非结案项目 · 硬件/软件/PM同一人同项目计一次 · 颜色按相对负载</p></div><div class="chart-card"><h2><label for="distribution">字段分布</label><select id="distribution"><option value="productLine">产品线</option><option value="customer">客户</option><option value="status">状态</option><option value="priority">优先级</option><option value="signal">信号灯</option><option value="stage">项目阶段</option></select></h2><div class="chart-wrap" id="distribution-chart"></div></div></section>
  <div class="toolbar-panel"><label class="read-label" for="search">搜索项目</label><input id="search" type="search" maxlength="255" placeholder="搜索项目名称 / 客户 / 芯片 / 负责人 / 市场预期…"><div class="filter-head"><button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-rows">筛选 ▸</button><button class="head-btn" id="clear">清空筛选</button></div><div id="filter-rows" hidden></div><div class="result-line" id="result-count"></div></div>
  <p class="read-message" id="message" role="status" aria-live="polite">正在读取项目…</p><div class="grid" id="card-grid" aria-busy="true"></div>
  <div class="read-pagination"><button class="head-btn" id="previous" disabled>上一页</button><span id="page-info"></span><button class="head-btn" id="next" disabled>下一页</button></div>
</div><script type="module" src="/board.ts"></script></body></html>
