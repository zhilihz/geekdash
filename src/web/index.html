<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GeekDash 项目看板</title></head>
<body class="board-page"><main class="page">
  <header class="app-header" data-app-header></header>
<div class="date-zone" id="date-zone"></div>
  <nav id="perspective-switch" class="board-perspective view-switch" aria-label="项目查看视角" hidden><button data-perspective="responsible" aria-pressed="true">负责人视角</button><button data-perspective="management" aria-pressed="false">管理视角</button></nav>
  <section class="board-check-entry" aria-labelledby="check-heading"><div><h2 id="check-heading">项目检查</h2><p id="today-check-count">正在读取本人项目的检查情况…</p></div><a class="board-primary" id="check-entry" href="/project-checks.html?view=all&checkToday=unchecked">进入项目检查</a></section>
  <nav class="board-views" aria-label="项目视图">
    <div class="board-view-group" role="group" aria-labelledby="project-scope-label"><span class="board-view-label" id="project-scope-label">项目范围</span><div class="view-switch"><button data-view="active">进行中</button><button data-view="proposal">提案 / 暂缓</button><button data-view="closed">已结案</button><button data-view="maintenance">量产维护</button><button data-view="all">全部项目</button></div></div>
    <div class="board-view-group board-layout-group" role="group" aria-labelledby="project-layout-label"><span class="board-view-label" id="project-layout-label">展示方式</span><div class="view-switch"><button class="active" id="layout-cards" aria-pressed="true">卡片</button><button id="layout-toggle" aria-pressed="false">驾驶舱</button></div></div>
  </nav>
  <section class="toolbar-panel" aria-label="搜索和筛选"><label class="read-label" for="search">搜索项目</label><input id="search" type="search" maxlength="255" placeholder="项目名称 / 客户 / 芯片 / 人员"><div class="filter-head"><button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-rows">▸ 展开筛选</button><button class="head-btn" id="filter-settings" aria-expanded="false">设置筛选</button><button class="head-btn" id="clear">清空筛选</button></div><div id="filter-settings-panel" class="filter-settings-panel" hidden></div><div id="selected-filters" aria-label="已选条件" hidden></div><div id="filter-rows" hidden></div></section>
  <div class="board-result"><p id="result-count" aria-live="polite"></p><details class="board-more"><summary>查看统计</summary><div class="board-stat-line"><div class="stats" id="stats-bar"></div><div class="stats" id="extra-stats"></div></div></details></div>
  <p class="read-message" id="message" role="status" aria-live="polite">正在读取项目…</p>
  <section id="cards-view"><div class="board-list-heading"><h2>项目列表</h2><div class="view-switch" aria-label="卡片内容"><button data-card-content="status">项目状态</button><button data-card-content="tasks">任务清单</button></div><a class="board-primary" href="/project-new.html">新建项目</a></div><div class="grid" id="card-grid" aria-busy="true"></div><div class="read-pagination"><button class="head-btn" id="previous" disabled>上一页</button><span id="page-info"></span><button class="head-btn" id="next" disabled>下一页</button></div></section>
  <section id="dashboard-view" aria-label="项目驾驶舱" hidden><div class="chart-grid" id="chart-grid"><section class="chart-card pp-card"><h2>重点项目进度</h2><p class="pp-subtitle" id="focus-count"></p><div class="pp-list" id="focus-projects"></div></section><section class="chart-card"><h2>每人负责项目数</h2><p class="pp-subtitle">当前可见及筛选范围 · 多人协作项目分别计入</p><div id="manager-project-counts"></div></section></div><section class="board-distribution-section"><div class="distribution-heading"><h2>项目分布</h2><label class="chart-percent"><input type="checkbox" id="chart-percent" checked>显示百分比</label><div id="distribution-options" class="distribution-options" aria-label="选择展示的分布"></div></div><div id="distribution-charts" class="distribution-charts"></div></section></section>
<section class="chart-card board-latest"><div class="activity-heading"><h2>最新状态动态</h2><div class="view-switch" aria-label="动态时间范围"><button data-activity-days="7">近7天</button><button data-activity-days="30">近30天</button></div><div class="view-switch" aria-label="动态条数"><button data-activity-count="5">5条</button><button data-activity-count="10">10条</button><button data-activity-count="20">20条</button></div></div><p class="pp-subtitle">当前可见及筛选范围内已保存的状态与任务修改</p><div id="latest-status"></div></section></main><script type="module" src="/board.ts"></script></body></html>
