<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeekDash · 项目设置</title></head><body><main class="page"><header class="app-header" data-app-header></header><div class="page-heading"><h1>项目设置</h1></div><p id="settings-message" role="status"></p><form id="check-settings" class="chart-card profile-form ui-form" hidden><h2>项目 CHECK 规则</h2><p class="read-label">全系统共用；检查仍只需点击一次，不填写额外表单。</p><label>检查周期<select id="check-frequency"><option value="daily">每天一次</option><option value="weekly">每周一次</option><option value="manual">不定期，只记录检查事实</option></select></label><label id="check-weekday-field">每周截止<select id="check-weekday"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></label><p id="check-setting-impact" class="read-label"></p><button type="submit" id="settings-save" class="save-btn">保存设置</button><button type="button" id="settings-query" class="head-btn" hidden>核对保存结果</button></form></main><script type="module" src="/settings.ts"></script></body></html>
