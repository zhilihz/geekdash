<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GeekDash · 项目检查</title></head>
<body><main class="page checks-page">
  <div class="topbar"><a id="back" class="back-btn" href="/">← 返回看板</a><div class="head-actions"><div class="view-switch"><button data-theme="dark">深色</button><button data-theme="light">浅色</button><button data-theme="warm">暖色</button></div></div></div>
  <header class="checks-heading"><div><h1>项目检查</h1><p id="check-scope"></p></div><button class="head-btn" id="check-reload" disabled>刷新列表</button></header>
  <div class="checks-summary"><nav class="view-switch" aria-label="检查范围"><button data-check-today="unchecked">本期未检查</button><button data-check-today="checked">本期已检查</button></nav><p id="check-rule"></p></div>
  <section id="check-recovery" class="checks-recovery" aria-label="检查结果待确认" hidden></section>
  <p id="check-loading" class="read-message" role="status">正在读取项目…</p><a id="login" class="back-btn" href="/login.html" hidden>登录 GeekDash</a>
  <section id="check-list" class="checks-list" aria-label="项目检查列表" aria-busy="true"></section>
  <nav class="read-pagination" aria-label="检查列表分页"><button class="head-btn" id="previous" disabled>上一页</button><span id="page-info"></span><button class="head-btn" id="next" disabled>下一页</button></nav>
</main>
<div id="project-notice" popover="manual" role="status" aria-live="polite" hidden><span id="notice-icon" aria-hidden="true">✓</span><div class="notice-content"><strong id="notice-title">已完成</strong><p id="message"></p></div><button id="notice-close" aria-label="关闭提示">×</button></div>
<script type="module" src="/project-checks.ts"></script></body></html>
