<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeekDash · 登录</title></head>
<body><main class="page auth-page"><header><h1>GeekDash</h1><p>智能硬件项目协作</p></header><div class="read-notice" id="notice">使用分配的账号登录；初始测试密码首次登录需要修改。</div>
<form id="login" class="detail-section auth-panel"><h2>登录</h2><label>登录名<input name="loginName" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="head-btn" type="submit">登录</button></form>
<form id="password" class="detail-section auth-panel" hidden><h2>修改密码</h2><label>当前密码<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="128"></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" required></label><label>确认新密码<input name="confirmPassword" type="password" autocomplete="new-password" required></label><p>15～128 个字符，可使用中文、空格和长短语。</p><button class="head-btn" type="submit">保存新密码</button></form>
<p id="message" role="status"></p><div class="head-actions"><a class="head-btn" href="/" id="back" hidden>进入看板</a><button class="head-btn" id="logout" hidden>退出当前会话</button></div><script type="module" src="/login.ts"></script></main></body></html>
