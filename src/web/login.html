<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeekDash · 登录</title></head>
<body><main class="page auth-page"><header><h1>GeekDash</h1><p>智能硬件项目协作</p></header><div class="read-notice" id="notice">使用分配的账号登录；初始测试密码首次登录需要修改。没有账号可使用邀请码注册。</div>
<form id="login" class="detail-section auth-panel"><h2>登录</h2><label>登录名<input name="loginName" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="head-btn" type="submit">登录</button><a class="back-btn" href="/register.html">注册账号</a></form>
<p id="message" role="status"></p><div class="head-actions"><a class="head-btn" href="/" id="back" hidden>进入看板</a><button class="head-btn" id="logout" hidden>退出当前会话</button></div><script type="module" src="/login.ts"></script></main></body></html>
