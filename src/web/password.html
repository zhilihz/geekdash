<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeekDash · 修改密码</title></head><body><main class="page auth-page"><header><a class="board-brand" href="/">GeekDash</a><h1>修改密码</h1></header><p id="password-notice" class="read-label">修改后需要使用新密码重新登录。</p><form id="password-form" class="detail-section auth-panel" hidden><label>当前密码<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" required></label><label>确认新密码<input name="confirmPassword" type="password" autocomplete="new-password" required></label><p class="read-label">至少8个字符，数字、大写字母、小写字母、特殊字符中至少包含两类。</p><button type="submit" class="save-btn">保存新密码</button></form><p id="password-message" role="status"></p><div class="head-actions"><a id="password-back" class="head-btn" href="/profile.html">返回个人资料</a><a class="head-btn" href="/login.html?logout=1">退出登录</a><a id="password-login" class="head-btn" href="/login.html" hidden>去登录</a></div></main><script type="module" src="/password.ts"></script></body></html>
