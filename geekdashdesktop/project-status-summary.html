<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目状态简要 · 智能硬件项目管理看板系统</title>
<style>
:root, [data-theme="dark"] {
  --bg: #0d1117; --bg-soft: #0f141a; --card: #161b22; --card-hover: #1b222c;
  --border: #30363d; --border-soft: #21262d;
  --text: #e6edf3; --text-dim: #8b949e; --text-faint: #6e7681;
  --accent: #58a6ff; --accent-dim: #1f6feb;
  --p-high: #f85149; --p-mid: #f0883e; --p-low: #3fb950;
}
[data-theme="light"] {
  --bg: #f6f8fa; --bg-soft: #ffffff; --card: #ffffff; --card-hover: #f0f3f6;
  --border: #d0d7de; --border-soft: #eaeef2;
  --text: #1f2328; --text-dim: #57606a; --text-faint: #8c959f;
  --accent: #0969da; --accent-dim: #1f6feb;
  --p-high: #d1242f; --p-mid: #bf5b0a; --p-low: #1a7f37;
}
[data-theme="warm"] {
  --bg: #faf5ec; --bg-soft: #f5eee0; --card: #fffaf0; --card-hover: #f3e9d7;
  --border: #e3d5bd; --border-soft: #efe5d0;
  --text: #3d3428; --text-dim: #7a6a52; --text-faint: #a08d70;
  --accent: #b45309; --accent-dim: #c2701d;
  --p-high: #c0392b; --p-mid: #d98324; --p-low: #6f9e3b;
}
[data-theme="tech"] {
  --bg: #0a0f1e; --bg-soft: #0d1428; --card: #101a30; --card-hover: #16233e;
  --border: #1e2a45; --border-soft: #182238;
  --text: #dbe6f7; --text-dim: #7f93b5; --text-faint: #5c7094;
  --accent: #22d3ee; --accent-dim: #0ea5b7;
  --p-high: #fb7185; --p-mid: #fbbf24; --p-low: #34d399;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.page { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }

.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.back-btn {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 14px; font-size: 13px; cursor: pointer;
}
.back-btn:hover { color: var(--text); background: var(--card-hover); }
.topbar .title { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
.topbar .title .ver { font-size: 12px; font-weight: 600; color: var(--text-faint); margin-left: 8px; }
.topbar .gen-date { margin-left: auto; font-size: 12.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.topbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.report-title-field { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; white-space: nowrap; }
.report-title-field input { width: 190px; border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; background: var(--bg-soft); color: var(--text); font: inherit; }
.report-title-field input:focus { outline: none; border-color: var(--accent); }
.print-report-title { display: none; }

.head-btn {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 13px; font-size: 13px; cursor: pointer;
}
.head-btn:hover { color: var(--text); background: var(--card-hover); }
.head-btn.primary { background: var(--accent-dim); color: #fff; border-color: var(--accent-dim); font-weight: 600; }
.head-btn.primary:hover { background: var(--accent); }
.export-folder-status { font-size: 12px; color: var(--text-faint); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quick-context { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; padding: 9px 12px; border: 1px solid rgba(147,51,234,.45); border-left: 4px solid #9333ea; border-radius: 8px; background: rgba(147,51,234,.10); color: var(--text); }
.quick-context.show { display: flex; }
.quick-context b { color: #a855f7; }
.status-with-maintenance { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.maintenance-badge { display: inline-block; padding: 0 6px; border-radius: 7px; background: #9333ea; color: #fff; font-size: 9px; font-weight: 700; line-height: 1.35; white-space: nowrap; }

.sort-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); }
.sort-wrap select {
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; font-size: 13px; cursor: pointer; outline: none;
}
.sort-wrap select:focus { border-color: var(--accent); }
.sort-wrap input[type="checkbox"] { cursor: pointer; width: 14px; height: 14px; accent-color: var(--accent-dim); vertical-align: -2px; }
.table-card.hide-col-customer .col-customer, .table-card.hide-col-group .col-group, .table-card.hide-col-status .col-status, .table-card.hide-col-note .col-note, .table-card.hide-col-engineers .col-engineers, .table-card.hide-col-stage .col-stage, .table-card.hide-col-node .col-node, .table-card.hide-col-dueDate .col-dueDate, .table-card.hide-col-delay .col-delay { display: none; }
td.cell-node { color: var(--text-dim); line-height: 1.6; }
td.cell-node .node-item { white-space: nowrap; }
td.cell-node .node-none { color: var(--text-faint); }
td.cell-group { white-space: nowrap; }

/* 分组筛选器 */
.group-filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.group-filter-bar .gf-label { font-size: 13px; color: var(--text-dim); }
.gf-chip { background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: 14px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; }
.gf-chip:hover { color: var(--text); background: var(--card-hover); }
.gf-chip.active { background: var(--accent-dim); color: #fff; border-color: var(--accent-dim); font-weight: 600; }

.hint { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }
.hint b { color: var(--text); }
.hint a { color: var(--accent); cursor: pointer; text-decoration: none; }
.hint a:hover { text-decoration: underline; }
.column-controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: -3px 0 12px; }
.column-controls .cc-label { font-size: 12.5px; color: var(--text-dim); margin-right: 2px; }
.column-control { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 7px; padding: 3px 5px 3px 9px; font-size: 12px; color: var(--text-dim); background: var(--bg-soft); }
.column-control.hidden { opacity: .65; }
.column-control button { border: 0; border-radius: 5px; background: transparent; color: var(--text-faint); cursor: pointer; padding: 1px 4px; font-size: 13px; line-height: 1.2; }
.column-control button:hover { background: var(--card-hover); color: var(--accent); }

.table-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; font-size: 12.5px; font-weight: 600; color: var(--text-dim);
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  background: var(--bg-soft); white-space: nowrap; position: sticky; top: 0;
}
tbody td { padding: 9px 14px; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { cursor: default; }
tbody tr.dragging { opacity: .4; }
tbody tr.drag-over td { background: var(--card-hover); }

.col-check { width: 34px; text-align: center; }
.col-check input { cursor: pointer; width: 15px; height: 15px; accent-color: var(--accent-dim); }
.col-grip { width: 28px; color: var(--text-faint); cursor: grab; text-align: center; user-select: none; }
.col-grip:hover { color: var(--text-dim); }
.col-action { width: 50px; text-align: center; white-space: nowrap; }
td.cell-customer { font-weight: 600; color: var(--text); white-space: nowrap; }
td.cell-name { font-weight: 500; }
.project-detail-link { color: var(--text); text-decoration: none; cursor: pointer; }
.project-detail-link:hover { color: var(--accent); text-decoration: underline; }
td.cell-date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-dim); }
td.cell-stage { white-space: nowrap; }
.stage-link { color: var(--accent); text-decoration: none; font-weight: 500; }
.stage-link:hover { text-decoration: underline; }
td.cell-status { color: var(--text-dim); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
td.cell-delay { white-space: nowrap; }
td.cell-note { min-width: 120px; color: var(--text); cursor: text; line-height: 1.5; }
td.cell-note:empty::before { content: "点击填写备注"; color: var(--text-faint); }
td.cell-note:focus { outline: 1px dashed var(--accent); background: var(--bg-soft); border-radius: 4px; }
.return-focus { outline: 3px solid var(--accent); outline-offset: -3px; }
.customer-group td { background: var(--bg-soft); }

.hide-btn { background: transparent; border: none; color: var(--text-faint); cursor: pointer; font-size: 12px; padding: 2px 7px; border-radius: 6px; }
.hide-btn:hover { color: var(--p-high); background: var(--card-hover); }

.delay-tag { display: inline-block; padding: 1px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.delay-tag.overdue { background: rgba(248,81,73,.15); color: #f85149; border: 1px solid rgba(248,81,73,.4); }
.delay-tag.normal { background: rgba(63,185,80,.15); color: #3fb950; border: 1px solid rgba(63,185,80,.4); }
.delay-tag.closed { background: rgba(139,148,158,.15); color: var(--text-dim); border: 1px solid var(--border); }
.delay-tag.none { background: rgba(139,148,158,.12); color: var(--text-faint); border: 1px solid var(--border); }

.empty { text-align: center; color: var(--text-faint); padding: 40px 16px; }

@media print {
  .topbar, .group-filter-bar, .hint, .column-controls, .col-check, .col-grip, .col-action { display: none !important; }
  .print-report-title { display: block; font-size: 20px; font-weight: 800; margin: 0 0 14px; color: #000; }
  tr.print-hide { display: none !important; }
  .page { padding: 0; }
  body { background: #fff; color: #000; }
  .table-card { border: 1px solid #ccc; }
  td.cell-note:empty::before { content: ""; }
}
@media (max-width: 640px) {
  .topbar .gen-date { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="back-btn" id="back-btn">← 返回看板</button>
    <span class="title">项目状态简要<span class="ver" id="ver"></span></span>
    <span class="gen-date" id="gen-date"></span>
    <div class="actions">
      <label class="report-title-field" title="留空时使用默认报告名称">报告名称<input id="report-title" type="text" maxlength="80" placeholder="项目状态纪要"></label>
      <label class="sort-wrap">排序
        <select id="sort-select" title="选择排序方式">
          <option value="customer">按客户</option>
          <option value="group">按分组</option>
          <option value="stage">按阶段</option>
          <option value="duedate">按预计结案日期</option>
        </select>
      </label>
      <button class="head-btn" id="reset-order" title="恢复默认顺序（同客户相邻）">↺ 重置顺序</button>
      <button class="head-btn" id="select-export-folder-btn" title="选择 Markdown、CSV 和图片的保存文件夹">📁 选择导出文件夹</button><span class="export-folder-status" id="export-folder-status">未选择文件夹</span>
      <button class="head-btn primary" id="export-md-btn" title="按勾选项目导出供 AI 读取的 Markdown">⬇ 导出 Markdown</button>
      <button class="head-btn primary" id="export-csv-btn" title="按勾选项目导出 CSV">⬇ 导出 CSV</button>
      <button class="head-btn primary" id="export-pdf-btn" title="按勾选项目导出 PDF（打印）">⬇ 导出 PDF</button>
      <button class="head-btn primary" id="export-image-btn" title="将当前勾选项目生成 PNG 图片">▣ 一键存图</button>
    </div>
  </div>

  <div class="group-filter-bar" id="group-filter-bar"></div>

  <div class="group-filter-bar" id="status-filter-bar"></div>
  <div class="group-filter-bar" id="engineer-filter-bar"></div>

  <div class="quick-context" id="quick-context"></div>

  <div class="hint" id="hint"></div>

  <div class="column-controls" id="column-controls" aria-label="字段显示控制"></div>

  <h1 class="print-report-title" id="print-report-title"></h1>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="check-all" title="全选"></th>
          <th class="col-grip" title="拖拽调整顺序">⠿</th>
          <th class="col-customer">客户</th>
          <th class="col-group">分组</th>
          <th>项目名称</th>
          <th class="col-status">项目最新状态</th>
          <th class="col-engineers">负责人</th>
          <th class="col-note">备注</th>
          <th class="col-stage">当前阶段</th>
          <th class="col-node">关键节点</th>
          <th class="col-dueDate">预计结案日期</th>
          <th class="col-delay">是否延期</th>
          <th class="col-action">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="projects-data.js"></script>
<script>
const { currentStage, normalizeNodes, todayStr, todayTimeStr, load } = PROJECT_DB;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const display = v => (v === "" || v === null || v === undefined) ? "-" : v;
const DETAIL_RETURN_CONTEXT_KEY = "hw_project_board_detail_return_context";
function rememberDetailReturn(projectId) {
  try {
    sessionStorage.setItem(DETAIL_RETURN_CONTEXT_KEY, JSON.stringify({ projectId: String(projectId), url: location.href, path: location.pathname, scrollX: window.scrollX, scrollY: window.scrollY }));
  } catch (error) { console.warn("无法保存详情返回上下文", error); }
}
function restoreDetailReturnContext() {
  let context;
  try { context = JSON.parse(sessionStorage.getItem(DETAIL_RETURN_CONTEXT_KEY) || "null"); } catch (error) { sessionStorage.removeItem(DETAIL_RETURN_CONTEXT_KEY); return; }
  if (!context || context.path !== location.pathname || context.url !== location.href) return;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.scrollTo(context.scrollX || 0, context.scrollY || 0);
    const target = document.querySelector(`#tbody tr[data-id="${CSS.escape(context.projectId)}"]`);
    if (target) {
      target.setAttribute("tabindex", "-1");
      target.classList.add("return-focus");
      target.focus({ preventScroll: true });
      setTimeout(() => target.classList.remove("return-focus"), 1800);
    }
    sessionStorage.removeItem(DETAIL_RETURN_CONTEXT_KEY);
  }));
}
window.addEventListener("pageshow", restoreDetailReturnContext);
document.addEventListener("click", (event) => {
  const link = event.target.closest('a[href^="project-detail.html?id="]');
  if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  const projectId = new URL(link.href).searchParams.get("id");
  if (projectId) rememberDetailReturn(projectId);
});

/* ---- 主题（共享 hw_project_board_theme） ---- */
const THEME_KEY = "hw_project_board_theme";
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); }
let theme = "dark";
try { theme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {}
applyTheme(theme);

/* ---- 版本 ---- */
$("#ver").textContent = window.APP_VERSION || PROJECT_DB.APP_VERSION || "";

/* ---- 首页统计卡片带来的快速筛选上下文 ---- */
const QUICK_CONTEXT_KEY = "hw_project_board_quick_filter_context";
const quickKey = new URLSearchParams(location.search).get("quick") || "";
let quickContext = null;
try {
  const saved = JSON.parse(sessionStorage.getItem(QUICK_CONTEXT_KEY) || "null");
  if (saved && saved.key === quickKey && Array.isArray(saved.ids)) {
    quickContext = { key: saved.key, label: String(saved.label || "快速筛选"), ids: saved.ids.map(Number).filter(Number.isInteger), sourceUrl: saved.sourceUrl || "GeekDash.html", createdAt: Number(saved.createdAt) || 0 };
  }
} catch (error) { console.warn("无法读取快速筛选条件", error); }
const quickMode = !!quickContext;
let quickSelectionInitialized = false;
if (quickMode) {
  document.title = `快速筛选：${quickContext.label} · 智能硬件项目管理看板系统`;
  $(".topbar .title").firstChild.textContent = "快速筛选结果";
  $("#quick-context").innerHTML = `当前范围：<b>${esc(quickContext.label)}</b>。列表继承首页进入时的看板、筛选和搜索条件；已自动勾选全部命中项目，可直接导出。`;
  $("#quick-context").classList.add("show");
}

/* ---- localStorage 持久化：顺序 / 隐藏 / 备注 ---- */
const ORDER_KEY = "hw_project_board_summary_order";
const HIDDEN_KEY = "hw_project_board_summary_hidden";
const QUICK_HIDDEN_KEY = quickMode ? `hw_project_board_quick_filter_hidden:${quickContext.key}:${quickContext.createdAt}` : "";
const NOTES_KEY = "hw_project_board_summary_notes";
function loadOrder() { try { return JSON.parse(localStorage.getItem(ORDER_KEY) || "null") || null; } catch (e) { return null; } }
function saveOrder(ids) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(ids)); } catch (e) {} }
function loadHidden() { try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]") || []; } catch (e) { return []; } }
function saveHidden(ids) { try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(ids)); } catch (e) {} }
function loadQuickHidden() { try { return JSON.parse(sessionStorage.getItem(QUICK_HIDDEN_KEY) || "[]") || []; } catch (e) { return []; } }
function saveQuickHidden(ids) { try { sessionStorage.setItem(QUICK_HIDDEN_KEY, JSON.stringify(ids)); } catch (e) {} }
function hiddenIdsForCurrentView() { return quickMode ? loadQuickHidden() : loadHidden(); }
function saveHiddenForCurrentView(ids) { if (quickMode) saveQuickHidden(ids); else saveHidden(ids); }
function loadNotes() { try { return JSON.parse(localStorage.getItem(NOTES_KEY) || "{}") || {}; } catch (e) { return {}; } }
function saveNotes(notes) { try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) {} }

/* ---- 最新状态：提取基本信息「项目状态描述」字段 ---- */
function latestStatus(p) { return PROJECT_DB.latestProjectStatus(p); }

/* ---- 当前所处阶段 ---- */
function stageName(p) {
  return PROJECT_DB.projectStageName(p);
}
function delayState(p) {
  return PROJECT_DB.projectDelayState(p);
}
function delayText(ds) {
  return PROJECT_DB.projectDelayText(ds);
}

/* ---- 未完成关键节点（从节点 tab 抽取，1/2/3 罗列） ---- */
function pendingNodes(p) {
  return PROJECT_DB.pendingProjectNodes(p);
}
function pendingNodesHtml(p) {
  const nodes = pendingNodes(p);
  if (!nodes.length) return `<span class="node-none">-</span>`;
  return nodes.map((n, i) =>
    `<div class="node-item">${i + 1}. ${esc(n.name)}${n.targetDate ? `（${esc(n.targetDate)}）` : ""}</div>`
  ).join("");
}
function pendingNodesText(p) {
  return PROJECT_DB.pendingProjectNodesText(p);
}

/* ---- 排序 ---- */
const SORT_KEY = "hw_project_board_summary_sort";
let sortMode = "customer";
try { sortMode = localStorage.getItem(SORT_KEY) || "customer"; } catch (e) { sortMode = "customer"; }
function saveSort(m) { try { localStorage.setItem(SORT_KEY, m); } catch (e) {} }
function dueSortKey(p) {
  const d = p.dueDate;
  return (!d || d === "-") ? "9999-99-99" : d;
}

// 默认：同客户相邻（按客户首次出现顺序），组内按预计结案日期
function defaultOrder(projects) {
  const result = [];
  const groups = new Map();
  projects.forEach(p => {
    const c = (p.customer && p.customer !== "-") ? p.customer : "未指定客户";
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(p);
  });
  groups.forEach((list) => {
    list.sort((a, b) => dueSortKey(a).localeCompare(dueSortKey(b)));
    list.forEach(p => result.push(p));
  });
  return result;
}
// 按阶段排序：当前阶段靠前（同阶段按结案日期）
function sortByStage(projects) {
  return [...projects].sort((a, b) => {
    const sa = currentStage(a), sb = currentStage(b);
    const ia = sa ? sa.index : 99;
    const ib = sb ? sb.index : 99;
    if (ia !== ib) return ia - ib;
    return dueSortKey(a).localeCompare(dueSortKey(b));
  });
}
// 按预计结案日期升序（无日期放最后）
function sortByDueDate(projects) {
  return [...projects].sort((a, b) => dueSortKey(a).localeCompare(dueSortKey(b)));
}
// 按分组排序（按分组库顺序，未分组排最后，组内按结案日期）
function groupName(p) { return (p.group && p.group !== "-") ? p.group : "未分组"; }
function sortByGroup(projects) {
  const groupOrder = PROJECT_DB.loadGroups().map(g => g.name);
  const idx = name => {
    const i = groupOrder.indexOf(name);
    return i < 0 ? groupOrder.length : i;
  };
  return [...projects].sort((a, b) => {
    const ga = groupName(a), gb = groupName(b);
    const ia = ga === "未分组" ? 999 : idx(ga);
    const ib = gb === "未分组" ? 999 : idx(gb);
    if (ia !== ib) return ia - ib;
    return dueSortKey(a).localeCompare(dueSortKey(b));
  });
}
function sortProjects(projects) {
  const saved = loadOrder();
  if (saved) {
    const byId = {}; projects.forEach(p => byId[p.id] = p);
    const list = saved.map(id => byId[id]).filter(Boolean);
    projects.forEach(p => { if (!saved.includes(p.id)) list.push(p); });
    return list;
  }
  if (sortMode === "group") return sortByGroup(projects);
  if (sortMode === "stage") return sortByStage(projects);
  if (sortMode === "duedate") return sortByDueDate(projects);
  return defaultOrder(projects);
}

/* ---- 拖拽排序（仅手柄可拖） ---- */
let dragRow = null;
function bindDrag() {
  $$("#tbody .col-grip").forEach(h => {
    h.addEventListener("dragstart", e => {
      dragRow = h.closest("tr");
      dragRow.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    h.addEventListener("dragend", () => {
      if (dragRow) dragRow.classList.remove("dragging");
      $$("#tbody tr.drag-over").forEach(r => r.classList.remove("drag-over"));
      dragRow = null;
      persistOrder();
    });
  });
  $$("#tbody tr[data-id]").forEach(row => {
    row.addEventListener("dragover", e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      if (row !== dragRow) row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      if (!dragRow || dragRow === row) return;
      const tbody = $("#tbody");
      const rect = row.getBoundingClientRect();
      const after = e.clientY > rect.top + rect.height / 2;
      tbody.insertBefore(dragRow, after ? row.nextSibling : row);
    });
  });
}
function persistOrder() {
  const ids = $$("#tbody tr[data-id]").map(r => parseInt(r.dataset.id, 10));
  saveOrder(ids);
}

function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
let exportFolderHandle = null;
function updateExportFolderStatus(message) { $("#export-folder-status").textContent = message; }
async function selectExportFolder() {
  if (!("showDirectoryPicker" in window)) {
    updateExportFolderStatus("当前浏览器不支持文件夹授权");
    alert("当前浏览器不支持选择导出文件夹。请使用最新版 Chromium 浏览器；本次可改用浏览器下载位置保存。");
    return null;
  }
  try {
    exportFolderHandle = await window.showDirectoryPicker({ mode: "readwrite" });
    updateExportFolderStatus("已选择：" + exportFolderHandle.name);
    return exportFolderHandle;
  } catch (error) {
    if (error && error.name !== "AbortError") alert("无法使用所选文件夹：" + error.message);
    return null;
  }
}
async function saveExportFile(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const handle = exportFolderHandle || await selectExportFolder();
  if (handle) {
    try {
      const fileHandle = await handle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      updateExportFolderStatus("已保存：" + handle.name);
      alert("已保存到所选文件夹：" + filename);
      return true;
    } catch (error) {
      alert("写入所选文件夹失败：" + error.message);
      return false;
    }
  }
  // 旧浏览器明确提示后回退到浏览器下载机制，避免用户无法导出。
  download(filename, blob, mime);
  return true;
}

    "- AI 智能体据此生成网页时，必须按本纪要式层级布局生成页面，并提供可操作的“一键保存图片”“保存为 HTML”“导出/保存为 PDF”“保存到知识库”按钮，而非只写出文字说明。",
    "- 每种保存操作都必须在用户点击后主动打开文件夹选择界面，由用户选择保存位置；用户取消选择或浏览器不支持文件夹授权时，必须显示明确提示，不能静默失败或自动写入默认目录。",
    "- 一键保存图片应导出当前网页或报告主体的图片文件；保存为 HTML 应导出可独立打开的网页文件；导出/保存为 PDF 应生成适合打印和归档的 PDF。",
    "- “保存到知识库”应先让用户选择目标父文件夹，再自动创建带日期时间戳的子文件夹（格式：`项目状态纪要知识库_YYYY-MM-DD_HHmmss`），并在其中写入本次纪要的知识库文件；不得覆盖既有归档。",
    "- 每个项目展示区域都必须提供“复制项目内容”按钮。点击后只复制该项目的完整纪要内容（项目名称、展示状态、当前情况、下一步、协作人员和原始字段），并显示复制成功或失败提示。",
    "- 上述导出、复制按钮和状态配色属于网页呈现与交付功能，不得篡改下方原始项目数据，也不得用无功能的占位按钮代替。",
    "",
    "## 原始项目数据（请勿改写）",
    ""
  ];
  let currentCustomer = null;
  let currentOwner = null;
  projects.forEach(({ project: p, owner, displayStatus }) => {
    const customer = p.customer || "未指定客户";
    const ownerKey = owner.name + "（" + owner.role + "）";
    if (customer !== currentCustomer) {
      currentCustomer = customer;
      currentOwner = null;
      lines.push(`## 客户：${markdownText(customer)}`, "");
    }
    if (ownerKey !== currentOwner) {
      currentOwner = ownerKey;
      lines.push(`### 主要负责人：${markdownText(owner.name)}（${owner.role}）`, "");
    }
    const currentSituation = latestStatus(p) === "-" ? "未提供" : latestStatus(p);
    const nextAction = pendingNodesText(p) === "-" ? "未提供" : pendingNodesText(p);
    const projectCollaborators = collaborators(p, owner);
    const fields = visibleReportFields(p, displayStatus);
    const statusText = isColumnVisible("status") ? ` 【${displayStatus.label}｜${displayStatus.color}】` : "";
    const situationText = isColumnVisible("status") ? ` ：${markdownText(currentSituation)}` : "";
    const nextText = isColumnVisible("node") ? ` → **下一步：${markdownText(nextAction)}**` : "";
    lines.push(
      `- **${markdownText(p.name)}**${statusText}${situationText}${nextText}（协作：${markdownText(projectCollaborators)}）`,
      "",
      `#### 项目原始字段：${markdownText(p.name)}`,
      "",
      "| 字段 | 原始内容 |",
      "| --- | --- |"
    );
    fields.forEach(([, label, value]) => lines.push(`| ${label} | ${markdownText(value)} |`));
    lines.push("");
  });
  await saveExportFile(fileNamePart(reportTitle()) + "_AI协作_" + todayStr() + ".md", "\uFEFF" + lines.join("\r\n"), "text/markdown;charset=utf-8");
}
async function exportCsv() {
  syncAllNotes();
  const ids = checkedIds();
  if (!ids.length) { alert("请先勾选要导出的项目（或使用表头全选）"); return; }
  const byId = {}; currentProjects.forEach(p => byId[p.id] = p);
  const exported = ids.map(id => byId[id]).filter(Boolean).map(p => visibleReportFields(p, presentationStatus(p)));
  const headers = exported[0]?.map(([, label]) => label) || [];
  const rows = exported.map(fields => fields.map(([, , value]) => value));
  const content = [headers, ...rows].map(row => row.map(csvCell).join(",")).join("\r\n");
  await saveExportFile(fileNamePart(reportTitle()) + "_" + todayStr() + ".csv", "\uFEFF" + content, "text/csv;charset=utf-8");
}
function selectedProjectsForExport() {
  const ids = checkedIds();
  if (!ids.length) { alert("请先勾选要导出的项目（或使用表头全选）"); return []; }
  const byId = new Map(currentProjects.map(p => [p.id, p]));
  return ids.map(id => byId.get(id)).filter(Boolean);
}
function imageText(value, length = 72) {
  const text = String(value == null ? "-" : value).replace(/\r?\n/g, " / ");
  return text.length > length ? text.slice(0, length - 1) + "…" : text;
}
function xmlEsc(value) { return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c])); }
async function exportImage() {
  syncAllNotes();
  const projects = selectedProjectsForExport();
  if (!projects.length) return;
  const width = 1600, left = 58, rowHeight = 42, titleHeight = 128;
  const columns = [
    ["name", "项目名称", 310, p => p.name], ["customer", "客户", 180, p => display(p.customer)], ["status", "状态", 400, p => latestStatus(p)], ["engineers", "负责人", 220, p => PROJECT_DB.statusEngineers(p).join("、") || "-"], ["dueDate", "预计结案", 170, p => display(p.dueDate)], ["delay", "延期", 130, p => delayText(delayState(p))]
  ].filter(([key]) => isColumnVisible(key));
  const height = titleHeight + rowHeight * (projects.length + 1) + 52;
  const text = (x, y, value, weight = 400, color = "#1f2328") => `<text x="${x}" y="${y}" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="${weight}" fill="${color}">${xmlEsc(value)}</text>`;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="100%" height="8" fill="#9333ea"/>${text(left, 54, reportTitle(), 700, "#111827")}${text(left, 84, `快速筛选：${quickMode ? quickContext.label : "当前已勾选项目"} · 共 ${projects.length} 个项目 · ${todayTimeStr()}`, 400, "#6b7280")}<rect x="${left}" y="${titleHeight}" width="${width - left * 2}" height="${rowHeight}" fill="#f3f4f6"/>`;
  let x = left;
  columns.forEach(([, label, columnWidth]) => { svg += text(x + 10, titleHeight + 27, label, 700, "#374151"); x += columnWidth; });
  projects.forEach((project, index) => {
    const y = titleHeight + rowHeight * (index + 1);
    svg += `<rect x="${left}" y="${y}" width="${width - left * 2}" height="${rowHeight}" fill="${index % 2 ? "#ffffff" : "#fafafa"}" stroke="#e5e7eb"/>`;
    let cx = left;
    columns.forEach(([, , columnWidth, value]) => { svg += text(cx + 10, y + 27, imageText(value(project), Math.max(12, Math.floor(columnWidth / 18))), 400, "#1f2937"); cx += columnWidth; });
  });
  svg += `</svg>`;
  const image = new Image();
  const svgUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
  try {
    await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; image.src = svgUrl; });
    const canvas = document.createElement("canvas"); canvas.width = width * 2; canvas.height = height * 2;
    const context = canvas.getContext("2d"); context.scale(2, 2); context.drawImage(image, 0, 0);
    const png = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    if (!png) throw new Error("浏览器未生成图片数据");
    await saveExportFile(fileNamePart(reportTitle()) + "_" + todayStr() + ".png", png, "image/png");
  } catch (error) { alert("生成图片失败：" + error.message); }
  finally { URL.revokeObjectURL(svgUrl); }
}
function exportPdf() {
  syncAllNotes();
  const ids = checkedIds();
  if (!ids.length) { alert("请先勾选要导出的项目（或使用表头全选）"); return; }
  const title = reportTitle();
  const previousDocumentTitle = document.title;
  $("#print-report-title").textContent = title;
  document.title = title;
  $$("#tbody tr[data-id]").forEach(tr => {
    tr.classList.toggle("print-hide", !ids.includes(parseInt(tr.dataset.id, 10)));
  });
  const restore = () => {
    $$("#tbody tr[data-id]").forEach(tr => tr.classList.remove("print-hide"));
    $("#print-report-title").textContent = "";
    document.title = previousDocumentTitle;
    window.removeEventListener("afterprint", restore);
  };
  window.addEventListener("afterprint", restore, { once: true });
  window.print();
  setTimeout(restore, 1000);
}

/* ---- 事件 ---- */
$("#back-btn").addEventListener("click", () => { history.length > 1 ? history.back() : (location.href = "GeekDash.html"); });
$("#reset-order").addEventListener("click", () => { localStorage.removeItem(ORDER_KEY); render(); });
$("#sort-select").addEventListener("change", e => {
  sortMode = e.target.value;
  saveSort(sortMode);
  localStorage.removeItem(ORDER_KEY); // 切换排序规则时清除手动拖拽顺序
  render();
});
$("#column-controls").addEventListener("click", e => {
  const button = e.target.closest("button[data-column]");
  if (!button) return;
  const key = button.dataset.column;
  if (!Object.hasOwn(columnVisibility, key)) return;
  columnVisibility[key] = !isColumnVisible(key);
  saveColumnVisibility();
  renderColumnControls();
});
$("#export-md-btn").addEventListener("click", exportMarkdown);
$("#export-csv-btn").addEventListener("click", exportCsv);
$("#export-pdf-btn").addEventListener("click", exportPdf);
$("#export-image-btn").addEventListener("click", exportImage);
$("#select-export-folder-btn").addEventListener("click", selectExportFolder);

$("#check-all").addEventListener("change", () => {
  const checked = $("#check-all").checked;
  $$("#tbody .row-check").forEach(cb => {
    cb.checked = checked;
    const id = parseInt(cb.dataset.id, 10);
    if (checked) checkedSet.add(id); else checkedSet.delete(id);
  });
});
$("#tbody").addEventListener("change", e => {
  if (!e.target.classList.contains("row-check")) return;
  const id = parseInt(e.target.dataset.id, 10);
  if (e.target.checked) checkedSet.add(id); else checkedSet.delete(id);
  syncCheckAll();
});
$("#tbody").addEventListener("click", e => {
  const hideBtn = e.target.closest(".hide-btn");
  if (hideBtn) {
    const id = parseInt(hideBtn.dataset.id, 10);
    const hidden = hiddenIdsForCurrentView();
    if (!hidden.includes(id)) hidden.push(id);
    saveHiddenForCurrentView(hidden);
    render();
  }
});
$("#tbody").addEventListener("focusout", e => {
  const td = e.target.closest(".cell-note");
  if (td) {
    notes[parseInt(td.dataset.id, 10)] = td.textContent.trim();
    saveNotes(notes);
  }
});

render();
</script>
