function drawPie(cv,lg,sl,cn,sp){if(!cv)return;var ctx=setupCanvas(cv,240,240);var total=sl.reduce(function(s,e){return s+e.n;},0);var cx=120,cy=120,r=88;var sa=-Math.PI/2;ctx.clearRect(0,0,240,240);if(total===0){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=cssVar("--chart-empty","#30363d");ctx.lineWidth=2;ctx.stroke();if(lg)lg.innerHTML="";return;}sl.forEach(function(sl){var ea=sa+sl.n/total*Math.PI*2;var pct=sl.n/total;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();ctx.fillStyle=sl.color;ctx.fill();ctx.strokeStyle=cssVar("--chart-stroke","#0d1117");ctx.lineWidth=2;ctx.stroke();if(sp&&pct>=0.05){var mid=sa+(ea-sa)/2;var tx=cx+Math.cos(mid)*r*0.74;var ty=cy+Math.sin(mid)*r*0.74;ctx.fillStyle="#ffffff";ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=3;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="600 11px sans-serif";ctx.fillText(Math.round(pct*100)+"%",tx,ty);ctx.shadowBlur=0;}sa=ea;});ctx.beginPath();ctx.arc(cx,cy,r*0.52,0,Math.PI*2);ctx.fillStyle=cssVar("--chart-center","#161b22");ctx.fill();ctx.fillStyle=cssVar("--chart-center-text","#e6edf3");ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="600 22px sans-serif";ctx.fillText(String(cn),cx,cy-6);ctx.fillStyle=cssVar("--text-faint","#8b949e");ctx.font="12px sans-serif";ctx.fillText("项目数",cx,cy+16);if(lg){lg.innerHTML=sl.map(function(sl){return '<li><span class="dot" style="background:'+sl.color+'"></span>'+esc(sl.label)+' <span class="cnt">'+sl.n+'</span></li>';}).join("");}}
function teamLoad(){var load={};PROJECTS.forEach(function(p){if(p.status==="已结案")return;var seen={};[p.hwOwner,p.swOwner,p.pm].forEach(function(n){if(n&&n!=="-"&&!seen[n]){seen[n]=1;load[n]=(load[n]||0)+1;}});});return Object.keys(load).map(function(n){return{name:n,count:load[n]};}).sort(function(a,b){return b.count-a.count||a.name.localeCompare(b.name,"zh");});}
function drawTeamLoad(cv,members){if(!cv)return;var n=members.length,w=360,pad=12,lw=72,rh=30;var h=Math.max(n*rh+pad*2,100);var ctx=setupCanvas(cv,w,h);ctx.clearRect(0,0,w,h);var tc=cssVar("--text","#e6edf3"),dc=cssVar("--text-dim","#8b949e"),fc=cssVar("--text-faint","#8b949e"),tk=cssVar("--chart-empty","#30363d");if(!n){ctx.fillStyle=fc;ctx.font="13px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("暂无团队成员或项目",w/2,h/2);return;}var mx=Math.max.apply(null,members.map(function(m){return m.count;}))||1;var bw=w-pad*2-lw-40;members.forEach(function(m,i){var y=pad+i*rh+rh/2;var r=m.count/mx;ctx.fillStyle=tc;ctx.font="12.5px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(m.name.length>4?m.name.slice(0,4)+"…":m.name,pad,y);var bx=pad+lw,bh=12,by=y-bh/2;ctx.fillStyle=tk;ctx.fillRect(bx,by,bw,bh);var wd=m.count>0?Math.max(4,bw*r):0;var c=r>=0.85?"#f85149":(r>=0.6?"#f0883e":"#3fb950");ctx.fillStyle=c;ctx.fillRect(bx,by,wd,bh);ctx.fillStyle=dc;ctx.textAlign="right";ctx.fillText(String(m.count),w-pad,y);});}
function renderProjectProgress(){var order={"高":0,"中":1,"低":2};var list=PROJECTS.filter(function(p){return p.status!=="已结案";}).sort(function(a,b){var oa=order[a.priority]!=null?order[a.priority]:9,ob=order[b.priority]!=null?order[b.priority]:9;return oa-ob||projectProgress(b)-projectProgress(a);});if(!list.length)return '<div class="pp-empty">暂无进行中的项目</div>';return list.map(function(p){var st=STATUS_STYLE[p.status];var prog=projectProgress(p);var pc=p.priority==="高"?"#f85149":(p.priority==="中"?"#f0883e":"#3fb950");var CIRC=2*Math.PI*18;var off=CIRC-(prog/100)*CIRC;return '<div class="pp-item"><div class="pp-ring"><svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--border-soft)" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="'+pc+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+CIRC.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 22 22)"/></svg><span class="pp-ring-pct" style="color:'+pc+'">'+prog+'%</span></div><div class="pp-info"><div class="pp-name" title="'+esc(p.name)+'">'+esc(p.name)+'</div><div class="pp-meta"><span class="pp-owner">'+esc(display(p.pm))+'</span><span class="pp-status" style="color:'+st.color+';border-color:'+st.color+'">'+esc(p.status)+'</span></div></div></div>';}).join("");}
function renderCharts(){var vis=visibleProjects();var fields=chartFields();var pp='<div class="chart-card pp-card"><h2>重点项目进度<span class="pp-subtitle">非结案项目实时进展 · 按优先级排序</span></h2><div class="pp-list">'+renderProjectProgress()+'</div></div>';var team='<div class="chart-card team-load-card"><h2>团队成员负载</h2><div class="chart-wrap"><canvas id="teamLoadChart" width="360" height="220"></canvas></div><div class="team-load-legend"><span><i style="background:#f85149"></i>高负载</span><span><i style="background:#f0883e"></i>中负载</span><span><i style="background:#3fb950"></i>正常</span></div></div>';$("#chart-grid").innerHTML=pp+team+fields.map(function(cfg){return '<div class="chart-card"><h2>'+esc(cfg.l)+'分布<button class="chart-hide-btn" data-dim="'+cfg.d+'" title="隐藏此图">×</button></h2><div class="chart-wrap"><canvas id="pc-'+cfg.d+'" width="240" height="240"></canvas><ul class="legend" id="pl-'+cfg.d+'"></ul></div></div>';}).join("");drawTeamLoad($("#teamLoadChart"),teamLoad());fields.forEach(function(cfg){var sl=fieldSlices(cfg.d,vis);drawPie($("#pc-"+cfg.d),$("#pl-"+cfg.d),sl,vis.length,filterSettings.showPct[cfg.d]!==false);});}
$("#chart-grid").addEventListener("click",function(e){var b=e.target.closest(".chart-hide-btn");if(!b)return;filterSettings.charts[b.dataset.dim]=true;saveFS();renderCharts();renderFS();});
function renderFS(){$("#fs-list").innerHTML=filterSettings.order.map(function(d,i){var c=FILTER_DIMS.filter(function(x){return x.d===d;})[0];var h=!!filterSettings.hidden[d];var co=!!filterSettings.charts[d];var po=filterSettings.showPct[d]===false;return '<div class="fs-item '+(h?"hidden":"")+'" data-dim="'+d+'"><span class="fs-name">'+c.l+'</span><button class="fs-vis-btn" data-act="toggle">'+(h?"已隐藏":"显示中")+'</button><button class="fs-chart-btn '+(co?"off":"")+'" data-act="chart">饼图'+(co?"关":"开")+'</button><button class="fs-pct-btn '+(po?"off":"")+'" data-act="pct">比例'+(po?"关":"开")+'</button><span class="fs-move"><button data-act="up" '+(i===0?"disabled":"")+'>↑</button><button data-act="down" '+(i===filterSettings.order.length-1?"disabled":"")+'>↓</button></span></div>';}).join("");}
$("#filter-settings-btn").addEventListener("click",function(){renderFS();$("#filter-settings-overlay").classList.add("open");});
$("#fs-close").addEventListener("click",function(){$("#filter-settings-overlay").classList.remove("open");});
$("#fs-done").addEventListener("click",function(){$("#filter-settings-overlay").classList.remove("open");});
$("#filter-settings-overlay").addEventListener("click",function(e){if(e.target===$("#filter-settings-overlay"))$("#filter-settings-overlay").classList.remove("open");});
$("#fs-reset-default").addEventListener("click",function(){filterSettings=defaultFS();saveFS();renderFS();renderFilters();renderCards();});
$("#fs-list").addEventListener("click",function(e){var b=e.target.closest("button[data-act]");if(!b)return;var d=b.closest(".fs-item").dataset.dim;var i=filterSettings.order.indexOf(d);if(b.dataset.act==="toggle"){if(filterSettings.hidden[d]){delete filterSettings.hidden[d];}else{filterSettings.hidden[d]=true;filterState[d]="";}saveFS();renderFS();renderFilters();renderCards();}else if(b.dataset.act==="chart"){if(filterSettings.charts[d]){delete filterSettings.charts[d];}else{filterSettings.charts[d]=true;}saveFS();renderFS();renderCharts();}else if(b.dataset.act==="pct"){if(filterSettings.showPct[d]===false){delete filterSettings.showPct[d];}else{filterSettings.showPct[d]=false;}saveFS();renderFS();renderCharts();}else if(b.dataset.act==="up"&&i>0){var t=filterSettings.order[i-1];filterSettings.order[i-1]=filterSettings.order[i];filterSettings.order[i]=t;saveFS();renderFS();renderFilters();}else if(b.dataset.act==="down"&&i<filterSettings.order.length-1){var t=filterSettings.order[i+1];filterSettings.order[i+1]=filterSettings.order[i];filterSettings.order[i]=t;saveFS();renderFS();renderFilters();}});
var THEME_KEY="hw_project_board_theme";function applyTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem(THEME_KEY,t);}catch(e){}document.querySelectorAll("#theme-switch button").forEach(function(b){b.classList.toggle("active",b.dataset.theme===t);});renderCharts();}$("#theme-switch").addEventListener("click",function(e){var b=e.target.closest("button[data-theme]");if(b)applyTheme(b.dataset.theme);});var theme=null;try{theme=localStorage.getItem(THEME_KEY)||"dark";}catch(e){theme="dark";}applyTheme(theme);
renderViewSwitch();document.querySelectorAll("#display-switch button").forEach(function(b){b.classList.toggle("active",b.dataset.mode==="card");});initStatDropdowns();renderCheckModeToggle();renderStats();renderCharts();renderFilters();renderCards();applyFilterCollapse();renderZoneToggle();renderActivityToggle();
$("#sys-menu-btn").addEventListener("click",function(e){e.stopPropagation();$("#sys-menu").classList.toggle("open");});$("#sys-menu").addEventListener("click",function(e){var gt=e.target.closest(".sys-group-title");if(gt){gt.closest(".sys-group").classList.toggle("collapsed");return;}if(e.target.closest(".sys-item"))$("#sys-menu").classList.remove("open");});document.addEventListener("click",function(e){if(!e.target.closest(".sys-menu-wrap"))$("#sys-menu").classList.remove("open");});function renderCheckModeToggle(){var b=$("#check-mode-toggle");if(b)b.textContent="项目CHECK模式："+(checkModeOn?"开":"关");}$("#check-mode-toggle").addEventListener("click",function(){checkModeOn=!checkModeOn;saveCheckMode();renderCheckModeToggle();renderStats();renderCards();});$("#risk-zone-toggle").addEventListener("click",function(){zoneSettings.riskZone=!zoneSettings.riskZone;saveZoneSettings();renderZoneToggle();renderRiskZone();});$("#change-zone-toggle").addEventListener("click",function(){zoneSettings.changeZone=!zoneSettings.changeZone;saveZoneSettings();renderZoneToggle();renderChangeZone();});$("#activity-zone-toggle").addEventListener("click",function(){activitySettings.enabled=!activitySettings.enabled;saveActivitySettings();renderActivityToggle();renderActivityZone();});$("#activity-count-switch").addEventListener("click",function(e){var b=e.target.closest("button[data-count]");if(!b)return;activitySettings.count=parseInt(b.dataset.count,10);saveActivitySettings();renderActivityToggle();renderActivityZone();});$("#activity-range-switch").addEventListener("click",function(e){var b=e.target.closest("button[data-range]");if(!b)return;activitySettings.days=parseInt(b.dataset.range,10);saveActivitySettings();renderActivityToggle();renderActivityZone();});
var WEEK_CN=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];function updateDateZone(){var n=new Date(),y=n.getFullYear(),de=$("#dz-date"),we=$("#dz-week"),te=$("#dz-time"),ce=$("#dz-cd-num");if(de)de.textContent=y+"年"+(n.getMonth()+1)+"月"+n.getDate()+"日";if(we)we.textContent=WEEK_CN[n.getDay()];if(te)te.textContent=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")+":"+String(n.getSeconds()).padStart(2,"0");if(ce){var e=new Date(y,11,31),ts=new Date(y,n.getMonth(),n.getDate());ce.textContent=String(Math.max(0,Math.round((e-ts)/86400000)));}}updateDateZone();setInterval(updateDateZone,1000);
