}

/* ==========================================================================
   Flow 流程图：阶段泳道（可点击编辑）+ 主节点（手动新建）+ 导出
   ========================================================================== */
const FLOW_LANE_H = 96, FLOW_LABEL_W = 190, FLOW_NODE_W = 150, FLOW_NODE_H = 60;
function flowProject() { return isNewMode ? draftProject : currentProject; }

// 节点坐标自动归位：按阶段泳道纵向排布、同阶段横向排列
function flowNodePos(stageId, index) {
  const i = Math.max(0, PROJECT_DB.STAGES.findIndex(s => s.id === stageId));
  return {
    x: FLOW_LABEL_W + 20 + index * (FLOW_NODE_W + 28),
    y: i * FLOW_LANE_H + (FLOW_LANE_H - FLOW_NODE_H) / 2
  };
}
// 连线总数（只按 nextId 单向计数，避免重复）
function countFlowLinks(nodes) {
  let c = 0; nodes.forEach(n => { if (n.nextId != null) c++; }); return c;
}

function renderFlow(p) {
  if (!p) return "";
  const stages = PROJECT_DB.normalizeStages(p.stages);
  const nodes = PROJECT_DB.normalizeNodes(p.nodes);
  const current = PROJECT_DB.currentStage(p);
  const isClosed = p.status === "已结案";

  const totalDays = stages.reduce((sum, s, i) => sum + (parseInt(s.days, 10) || PROJECT_DB.STAGES[i].mid), 0);
  const doneStageCount = stages.filter(s => s.done).length;
  const doneNodeCount = nodes.filter(n => n.doneDate).length;
  const maxDays = daysBetween(p.proposalDate, p.dueDate);
  const durError = (maxDays !== null && totalDays > maxDays);

  // 按 stageId 分组，并为无坐标节点自动归位
  const laneCount = {};
  const byStage = {};
  PROJECT_DB.STAGES.forEach(s => { byStage[s.id] = []; });
  byStage[0] = [];
  nodes.forEach(n => {
    const sid = (n.stageId && byStage[n.stageId] != null) ? n.stageId : 0;
    byStage[sid].push(n);
    if (n.x == null || n.y == null) {
      const cnt = laneCount[sid] || 0;
      const pos = flowNodePos(sid, cnt);
      n.x = pos.x; n.y = pos.y;
      laneCount[sid] = cnt + 1;
    }
  });
  // 把自动归位的坐标写回原始数据（仅当原始缺失）
  const rawNodes = Array.isArray(p.nodes) ? p.nodes : [];
  nodes.forEach(n => {
    const raw = rawNodes.find(r => r && String(r.id) === String(n.id));
    if (raw && (raw.x == null || raw.y == null)) { raw.x = n.x; raw.y = n.y; }
  });

  const errorBanner = durError
    ? `<div class="stages-error">⚠ 计算工期出错：项目总工期 <b>${totalDays}</b> 天，超过「预计结案日期 − 提案日期」<b>${maxDays}</b> 天，请调整各阶段预期天数或项目日期。</div>`
    : "";

  const summary = `<div class="stages-total">项目总工期：<b>${totalDays}</b> 天 · 阶段完成 <b>${doneStageCount}</b>/${PROJECT_DB.STAGES.length} · 节点 <b>${nodes.length}</b> 个（完成 <b>${doneNodeCount}</b>）${maxDays !== null ? ` · 可用窗口 <b>${maxDays}</b> 天` : ""}</div>`;

  // 泳道 + 标签
  const lanes = PROJECT_DB.STAGES.map((s, i) => {
    const st = stages[i];
    const isCurrent = !isClosed && current && current.index === i;
    const laneCls = st.done ? "lane-done" : (isClosed ? "lane-closed" : (isCurrent ? "lane-current" : ""));
    const stateTxt = st.done ? "✅ 已完成" + (st.doneDate ? " · " + st.doneDate : "")
      : (isClosed ? "⏹ 已结案" : (isCurrent ? "🔵 进行中" : "🔒 待解锁"));
    return `
      <div class="flow-lane" data-stage="${s.id}" style="top:${i * FLOW_LANE_H}px"></div>
      <div class="flow-lane-label ${laneCls}" data-stage="${s.id}" style="top:${i * FLOW_LANE_H}px" title="点击编辑阶段 S${s.id} ${esc(s.name)}">
        <span class="sl-name">S${s.id} ${esc(s.name)}</span>
        <span class="sl-milestone" title="${esc(s.milestone)}">里程碑：${esc(s.milestone)}</span>
        <span class="sl-state">${stateTxt}</span>
      </div>`;
  }).join("");

  // 节点（可拖拽 + 左右端口连线）
  const nodeHtml = nodes.map(n => {
    const done = !!n.doneDate;
    return `<div class="flow-node ${done ? "done" : "todo"}" data-id="${n.id}" data-stage="${n.stageId}" style="left:${n.x}px;top:${n.y}px" title="点击编辑节点">
      <button type="button" class="fn-del" data-id="${n.id}" title="删除该节点">×</button>
      <span class="flow-port in" data-id="${n.id}" title="连接上一个节点（拖到其它节点）"></span>
      <div class="fn-name">${esc(n.name || "未命名节点")}</div>
      <div class="fn-date">${done ? "✓ " + esc(n.doneDate) : (esc(n.targetDate) || "未排期")}</div>
      <span class="flow-port out" data-id="${n.id}" title="连接下一个节点（拖到其它节点）"></span>
    </div>`;
  }).join("");

  // 每个泳道右侧「＋ 节点」按钮
  const laneAddBtns = PROJECT_DB.STAGES.map((s, i) => `
      <button type="button" class="flow-lane-add" data-stage="${s.id}" style="top:${i * FLOW_LANE_H + 10}px" title="在该阶段新增节点">＋ 节点</button>`).join("");

  const totalH = PROJECT_DB.STAGES.length * FLOW_LANE_H + 24;

  return `<div class="flow-toolbar">
      <span class="flow-hint">拖节点调整位置 · 拖节点左右圆点连线（可跨阶段）· 点连线删除 · 点节点编辑 · 点左侧泳道标签编辑阶段</span>
      <span class="flow-hint" style="margin-left:auto">节点 ${nodes.length} 个 · 连线 ${countFlowLinks(nodes)} 条</span>
      <button type="button" class="btn" id="flow-preview">🖼 预览图</button>
      <button type="button" class="btn" id="flow-export-md">导出 Markdown</button>
      <button type="button" class="btn primary" id="flow-export-pdf">导出 PDF</button>
    </div>
    ${errorBanner}${summary}
    <div class="flow-canvas" id="flow-canvas">
      <div class="flow-inner" id="flow-inner" style="height:${totalH}px">
        <svg class="flow-links" id="flow-links" width="1600" height="${totalH}"></svg>
        ${lanes}
        ${nodeHtml}
      </div>
      ${laneAddBtns}
    </div>`;
}

// 刷新 Flow（重渲染 + 重绘连线）
function refreshFlow(p) {
  if (!p) return;
  $("#pane-flow").innerHTML = renderFlow(p);
  renderFlowLinks(p);
}

// 绘制节点连线（SVG 贝塞尔曲线 + 可点击删除的透明命中线）
function renderFlowLinks(p) {
  const svg = document.getElementById("flow-links");
  if (!svg) return;
  const nodes = PROJECT_DB.normalizeNodes(p.nodes);
  const byId = {};
  nodes.forEach(n => { byId[String(n.id)] = n; });
  let h = '';
  const drawn = new Set();
  const cy = FLOW_NODE_H / 2;
  nodes.forEach(m => {
    if (m.nextId != null) {
      const b = byId[String(m.nextId)];
      if (b) {
        const key = m.id + "-" + b.id;
        if (drawn.has(key)) return;
        drawn.add(key);
        const x1 = m.x + FLOW_NODE_W + 7, y1 = m.y + cy;
        const x2 = b.x - 7, y2 = b.y + cy;
        const mx = (x1 + x2) / 2;
        h += `<path class="flow-link-path" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`;
        h += `<circle class="flow-link-dot" cx="${x1}" cy="${y1}" r="3.5"/><circle class="flow-link-dot" cx="${x2}" cy="${y2}" r="3.5"/>`;
        h += `<path class="flow-link-hit" data-from="${m.id}" data-to="${b.id}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" title="点击删除连线"/>`;
      }
    }
  });
  svg.innerHTML = h;
}

/* ---- 节点编辑对话框（新增 / 编辑 / 标记完成 / 前后置连线） ---- */
let pfEditNodeId = null, pfNodeStageId = 0;

function openPfNodeDialog(node, stageId) {

function savePfNode() {
  const p = flowProject(); if (!p) return;
  const name = $("#pfn-name").value.trim();
  const output = $("#pfn-output").value.trim();
  if (!name) { showToast("请填写节点名称", 2000); return; }
  if (!output) { showToast("请填写输出成果", 2000); return; }
  const targetDate = $("#pfn-target").value;
  const doneDate = $("#pfn-done").value;
  const stageName = (PROJECT_DB.STAGES.find(s => s.id === pfNodeStageId) || {}).name || "";
  const prevId = $("#pfn-prev").value ? Number($("#pfn-prev").value) : null;
  const nextId = $("#pfn-next").value ? Number($("#pfn-next").value) : null;
  const arr = Array.isArray(p.nodes) ? p.nodes : [];
  p.statusHistory = normalizeHistory(p.statusHistory);
  if (pfEditNodeId != null) {

    if (n) {
      n.name = name; n.targetDate = targetDate; n.doneDate = doneDate; n.output = output;
      if (pfNodeStageId) { n.stageId = pfNodeStageId; n.stage = stageName; }
      p.statusHistory.push({ date: todayTimeStr(), text: `编辑项目节点（${stageName}${doneDate ? "，已完成" : ""}）：${name} · ${output}` });
    }
  } else {
    const id = PROJECT_DB.nextId(arr);
    arr.push({ id, name, stage: stageName, stageId: pfNodeStageId, targetDate, output, doneDate, prevId: null, nextId: null, x: null, y: null });
    pfEditNodeId = id;
    p.statusHistory.push({ date: todayTimeStr(), text: `新增项目节点（${stageName}${doneDate ? "，已完成" : ""}）：${name} · ${output}` });
  }
  applyNodeLink(arr, pfEditNodeId, prevId, nextId);

}
function closePfNodeDialog() { $("#pf-node-overlay").style.display = "none"; }

// 统一写入节点前后置连线（prevId/nextId 双向同步）
function applyNodeLink(arr, selfId, prevId, nextId) {
  const self = arr.find(x => x && String(x.id) === String(selfId));
  if (!self) return;
  if (self.prevId != null) { const old = arr.find(x => x && String(x.id) === String(self.prevId)); if (old && old.nextId === selfId) old.nextId = null; }
  if (self.nextId != null) { const old = arr.find(x => x && String(x.id) === String(self.nextId)); if (old && old.prevId === selfId) old.prevId = null; }
  self.prevId = prevId;
  self.nextId = nextId;
  if (prevId != null) { const a = arr.find(x => x && String(x.id) === String(prevId)); if (a) a.nextId = selfId; }
  if (nextId != null) { const b = arr.find(x => x && String(x.id) === String(nextId)); if (b) b.prevId = selfId; }
}

function deletePfNode(id) {
  const p = flowProject(); if (!p) return;
  if (!confirm("确定删除该节点？其相关连线会一并清除。")) return;
  const arr = Array.isArray(p.nodes) ? p.nodes : [];
  const target = arr.find(n => n && String(n.id) === String(id));
  // 清理其它节点对该节点的前后置引用
  arr.forEach(x => {
    if (x && x.prevId != null && String(x.prevId) === String(id)) x.prevId = null;
    if (x && x.nextId != null && String(x.nextId) === String(id)) x.nextId = null;
  });
  p.nodes = arr.filter(x => !x || String(x.id) !== String(id));
  p.statusHistory = normalizeHistory(p.statusHistory);
  if (target) p.statusHistory.push({ date: todayTimeStr(), text: `删除项目节点（${target.stage || "-"}）：${target.name || "未命名节点"}` });
  if (!isNewMode) PROJECT_DB.save(projects);
  refreshFlow(p);
  $("#pane-nodes").innerHTML = renderNodes(p);
  $("#pane-history").innerHTML = renderHistory(p);
  showToast("节点已删除", 1600);
}

// 删除一条连线（A→B）
function deleteFlowLink(fromId, toId) {
  const p = flowProject(); if (!p) return;
  const arr = Array.isArray(p.nodes) ? p.nodes : [];
  const a = arr.find(x => x && String(x.id) === String(fromId));
  const b = arr.find(x => x && String(x.id) === String(toId));
  if (a && a.nextId === toId) a.nextId = null;
  if (b && b.prevId === fromId) b.prevId = null;
  if (!isNewMode) PROJECT_DB.save(projects);
  refreshFlow(p);
  showToast("连线已删除", 1500);
}

// 新增节点（挂到指定阶段泳道，就地补全）
function addFlowNode(stageId) {
  const p = flowProject(); if (!p) return;
  const arr = Array.isArray(p.nodes) ? p.nodes : [];
  const id = PROJECT_DB.nextId(arr);
  const stageName = (PROJECT_DB.STAGES.find(s => s.id === stageId) || {}).name || "";
  const pos = flowNodePos(stageId, arr.filter(n => n && n.stageId === stageId).length);
  arr.push({ id, name: "新节点" + (arr.length + 1), stage: stageName, stageId, targetDate: "", output: "", doneDate: "", prevId: null, nextId: null, x: pos.x, y: pos.y });
  if (!isNewMode) PROJECT_DB.save(projects);
  refreshFlow(p);
  $("#pane-nodes").innerHTML = renderNodes(p);
  openPfNodeDialog(PROJECT_DB.normalizeNodes(p.nodes).find(n => n.id === id), stageId);
}

/* ---- 拖拽节点 + 拖线连线 ---- */
let flowDrag = null, flowLink = null, flowMoved = false;

document.addEventListener("mousedown", e => {
  const port = e.target.closest(".flow-port");
  if (port && port.closest("#pane-flow")) { startFlowLink(e, port); return; }
  const node = e.target.closest("#pane-flow .flow-node");
  if (!node) return;
  if (e.target.closest(".fn-del")) return; // 删除按钮不触发拖拽
  if (readOnly) return;
  const p = flowProject(); if (!p) return;
  const inner = document.getElementById("flow-inner");
  const rect = inner.getBoundingClientRect();
  flowDrag = { id: node.dataset.id, startX: e.clientX, startY: e.clientY, offX: e.clientX - rect.left - parseInt(node.style.left, 10), offY: e.clientY - rect.top - parseInt(node.style.top, 10) };
  flowMoved = false;
  node.classList.add("dragging");
  e.preventDefault();
});

document.addEventListener("mousemove", e => {
  if (flowLink) { updateFlowLinkGhost(e); return; }
  if (!flowDrag) return;
  if (Math.abs(e.clientX - flowDrag.startX) > 4 || Math.abs(e.clientY - flowDrag.startY) > 4) flowMoved = true;
  const inner = document.getElementById("flow-inner");
  if (!inner) return;
  const rect = inner.getBoundingClientRect();
  const x = Math.max(FLOW_LABEL_W - 20, Math.round(e.clientX - rect.left - flowDrag.offX));
  const y = Math.max(0, Math.round(e.clientY - rect.top - flowDrag.offY));
  const node = document.querySelector(`.flow-node[data-id="${flowDrag.id}"]`);
  if (node) { node.style.left = x + "px"; node.style.top = y + "px"; }
});

document.addEventListener("mouseup", e => {
  if (flowLink) { endFlowLink(e); return; }
  if (!flowDrag) return;
  const p = flowProject();
  const node = document.querySelector(`.flow-node[data-id="${flowDrag.id}"]`);
  if (p && node) {
    const arr = Array.isArray(p.nodes) ? p.nodes : [];
    const nd = arr.find(n => n && String(n.id) === String(flowDrag.id));
    if (nd) { nd.x = parseInt(node.style.left, 10); nd.y = parseInt(node.style.top, 10); }
    renderFlowLinks(p);
    if (!isNewMode) PROJECT_DB.save(projects);
  }
  document.querySelectorAll(".flow-node.dragging").forEach(el => el.classList.remove("dragging"));
  flowDrag = null;
});

function startFlowLink(e, port) {
  const p = flowProject(); if (!p || readOnly) return;
  flowLink = { id: port.dataset.id, type: port.classList.contains("out") ? "out" : "in", startX: e.clientX, startY: e.clientY };
  flowMoved = false;
  e.preventDefault();
}
function updateFlowLinkGhost(e) {
  if (Math.abs(e.clientX - flowLink.startX) > 4 || Math.abs(e.clientY - flowLink.startY) > 4) flowMoved = true;
  const inner = document.getElementById("flow-inner");
  const svg = document.getElementById("flow-links");
  if (!inner || !svg) return;
  const rect = inner.getBoundingClientRect();
  const from = document.querySelector(`.flow-node[data-id="${flowLink.id}"]`);
  if (!from) return;
  const isOut = flowLink.type === "out";
  const x1 = parseInt(from.style.left, 10) + (isOut ? FLOW_NODE_W : 0);
  const y1 = parseInt(from.style.top, 10) + FLOW_NODE_H / 2;
  const x2 = e.clientX - rect.left;
  const y2 = e.clientY - rect.top;
  let ghost = document.getElementById("flow-ghost");
  if (!ghost) {
    ghost = document.createElementNS("http://www.w3.org/2000/svg", "path");
    ghost.setAttribute("id", "flow-ghost");
    ghost.setAttribute("class", "flow-ghost");
    svg.appendChild(ghost);
  }
  const mx = (x1 + x2) / 2;
  ghost.setAttribute("d", `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`);
}
function endFlowLink(e) {
  const ghost = document.getElementById("flow-ghost");
  if (ghost) ghost.remove();
  const p = flowProject();
  const target = e.target.closest("#pane-flow .flow-node");
  if (flowLink && flowMoved && p && target && String(target.dataset.id) !== String(flowLink.id)) {
    const arr = Array.isArray(p.nodes) ? p.nodes : [];
    const nd = arr.find(n => n && String(n.id) === String(flowLink.id));
    const tg = arr.find(n => n && String(n.id) === String(target.dataset.id));
    if (nd && tg) {
      if (flowLink.type === "out") {
        if (nd.nextId != null) { const old = arr.find(x => x && String(x.id) === String(nd.nextId)); if (old && old.prevId === flowLink.id) old.prevId = null; }
        nd.nextId = Number(target.dataset.id); tg.prevId = Number(flowLink.id);
      } else {
        if (nd.prevId != null) { const old = arr.find(x => x && String(x.id) === String(nd.prevId)); if (old && old.nextId === flowLink.id) old.nextId = null; }
        nd.prevId = Number(target.dataset.id); tg.nextId = Number(flowLink.id);
      }
      renderFlowLinks(p);
      if (!isNewMode) PROJECT_DB.save(projects);
      showToast(flowLink.type === "out" ? "已连接下一个节点" : "已连接上一个节点", 1500);
    }
  }
  flowLink = null;
}

/* ---- 事件委托（仅「项目 Flow」tab 内生效） ---- */
document.addEventListener("click", e => {
  const inFlow = e.target.closest("#pane-flow");
  if (!inFlow) return;

  // 点连线删除
  const hit = e.target.closest(".flow-link-hit");
  if (hit) { if (!readOnly) deleteFlowLink(Number(hit.dataset.from), Number(hit.dataset.to)); return; }
  // 节点删除按钮
  const delBtn = e.target.closest(".fn-del");
  if (delBtn) { if (!readOnly) deletePfNode(Number(delBtn.dataset.id)); return; }
  // 泳道「＋ 节点」按钮
  const addBtn = e.target.closest(".flow-lane-add");
  if (addBtn) { if (!readOnly) addFlowNode(Number(addBtn.dataset.stage)); return; }
  // 点泳道标签 → 编辑阶段
  const lane = e.target.closest(".flow-lane-label");
  if (lane) { if (!readOnly) openPfStageDialog(Number(lane.dataset.stage)); return; }
  // 点节点 → 编辑节点
  const node = e.target.closest(".flow-node");
  if (node) {
    if (flowMoved) { flowMoved = false; return; }
    if (!readOnly) {
      const id = Number(node.dataset.id);
      const n = PROJECT_DB.normalizeNodes(flowProject().nodes).find(x => x.id === id);
      if (n) openPfNodeDialog(n, n.stageId);
    }
    return;
  }
});

// 双击泳道空白 → 在该阶段新增节点
document.addEventListener("dblclick", e => {
  const lane = e.target.closest(".flow-lane");
  if (lane && lane.closest("#pane-flow") && !readOnly) addFlowNode(Number(lane.dataset.stage));
});

/* ---- 导出 Markdown / PDF（阶段 + 节点清单） ---- */
function flowDownload(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function flowBuildText() {
  const p = flowProject(); if (!p) return { md: "", html: "" };
  const stages = PROJECT_DB.normalizeStages(p.stages);
  const nodes = PROJECT_DB.normalizeNodes(p.nodes);
  const byStage = {};
  PROJECT_DB.STAGES.forEach(s => { byStage[s.id] = []; });
  byStage[0] = [];
  nodes.forEach(n => { const sid = (n.stageId && byStage[n.stageId]) ? n.stageId : 0; byStage[sid].push(n); });
  const md = [], html = [];
  const title = (p.name || "项目") + " · 项目 Flow";

  return { md: md.join("\n"), html: html.join("") };
}

/* ---- 预览图：SVG 渲染 → PNG 导出 + 页面内预览 ---- */
function escXml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function svgTextLines(text, maxChars) {
  const lines = [];
  let cur = "";
  for (const ch of String(text)) {
    if (cur.length >= maxChars) { lines.push(cur); cur = ""; }
    cur += ch;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 2);
}
function buildFlowSvg(p) {
  const nodes = PROJECT_DB.normalizeNodes(p.nodes);
  const stages = PROJECT_DB.normalizeStages(p.stages);
  const current = PROJECT_DB.currentStage(p);
  const isClosed = p.status === "已结案";
  const W = Math.max(1100, ...nodes.map(n => n.x + FLOW_NODE_W + 60));
  const H = PROJECT_DB.STAGES.length * FLOW_LANE_H + 16;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Microsoft YaHei, PingFang SC, sans-serif">`;
  svg += `<rect width="100%" height="100%" fill="#ffffff"/>`;
  // 泳道 + 标签
  PROJECT_DB.STAGES.forEach((s, i) => {
    const st = stages[i];
    const isCur = !isClosed && current && current.index === i;
    const y = i * FLOW_LANE_H;
    svg += `<rect x="0" y="${y}" width="${W}" height="${FLOW_LANE_H}" fill="${isCur ? "#eef4ff" : (i % 2 ? "#f8fafc" : "#ffffff")}" stroke="#e5e7eb"/>`;
    svg += `<rect x="0" y="${y}" width="${FLOW_LABEL_W}" height="${FLOW_LANE_H}" fill="${isCur ? "#dbeafe" : "#f3f4f6"}" stroke="#e5e7eb"/>`;
    const stateTxt = st.done ? "已完成" : (isClosed ? "已结案" : (isCur ? "进行中" : "待解锁"));
    const stateColor = st.done ? "#16a34a" : (isClosed ? "#6b7280" : (isCur ? "#2563eb" : "#9ca3af"));
    svg += `<text x="14" y="${y + 22}" font-size="13" font-weight="bold" fill="#111827">S${s.id} ${escXml(s.name)}</text>`;
    svg += `<text x="14" y="${y + 44}" font-size="10" fill="#6b7280">${escXml((s.milestone || "").slice(0, 22))}</text>`;
    svg += `<text x="14" y="${y + 66}" font-size="11" font-weight="bold" fill="${stateColor}">${stateTxt}</text>`;
  });
  // 连线
  const byId = {};
  nodes.forEach(n => byId[String(n.id)] = n);
  const drawn = new Set();
  nodes.forEach(m => {
    if (m.nextId != null) {
      const b = byId[String(m.nextId)];
      if (b) {
        const key = m.id + "-" + b.id;
        if (drawn.has(key)) return;
        drawn.add(key);
        const x1 = m.x + FLOW_NODE_W + 7, y1 = m.y + FLOW_NODE_H / 2;
        const x2 = b.x - 7, y2 = b.y + FLOW_NODE_H / 2;
        const mx = (x1 + x2) / 2;
        svg += `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>`;
        svg += `<circle cx="${x2}" cy="${y2}" r="4" fill="#2563eb"/>`;
      }
    }
  });
  // 节点
  nodes.forEach(n => {
    const done = !!n.doneDate;
    const x = n.x, y = n.y;
    const fill = done ? "#f0fdf4" : "#fff7ed";
    const stroke = done ? "#16a34a" : "#ea580c";
    svg += `<rect x="${x}" y="${y}" width="${FLOW_NODE_W}" height="${FLOW_NODE_H}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    const lines = svgTextLines(n.name || "未命名节点", 12);
    lines.forEach((ln, k) => {
      svg += `<text x="${x + 12}" y="${y + 20 + k * 16}" font-size="12" font-weight="bold" fill="#111827">${escXml(ln)}</text>`;
    });
    svg += `<text x="${x + 12}" y="${y + FLOW_NODE_H - 12}" font-size="10" fill="#6b7280">${done ? "✓ " + escXml(n.doneDate) : escXml(n.targetDate || "未排期")}</text>`;
    svg += `<circle cx="${x}" cy="${y + FLOW_NODE_H / 2}" r="5" fill="${stroke}"/>`;
    svg += `<circle cx="${x + FLOW_NODE_W}" cy="${y + FLOW_NODE_H / 2}" r="5" fill="${stroke}"/>`;
  });
  svg += `</svg>`;
  return svg;
}
function svgToPng(svg, cb) {
  const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    try { cb(canvas.toDataURL("image/png")); } catch (e) { cb(null); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}
function flowPreview() {
  const p = flowProject(); if (!p) return;
  svgToPng(buildFlowSvg(p), (dataUrl) => {
    if (!dataUrl) { showToast("预览图生成失败", 2000); return; }
    $("#pf-preview-img").src = dataUrl;
    $("#pf-preview-title").textContent = (p.name || "项目") + " · 项目阶段节点图";
    $("#pf-preview-overlay").style.display = "flex";
  });
}
function downloadFlowPreview() {
  const img = $("#pf-preview-img");
  if (!img || !img.src || !img.src.startsWith("data:")) return;
  const a = document.createElement("a");
  a.href = img.src;

  document.body.appendChild(a); a.click(); a.remove();
}
function closeFlowPreview() { $("#pf-preview-overlay").style.display = "none"; }

// ---- 保存 ----
function saveDetail() {
  if (readOnly) return; // 浏览只读模式禁止保存
  // 新建模式：创建项目
  if (isNewMode) { createProject(); return; }

  const p = currentProject;
  if (!p) return;
  const oldStatus = p.status;
  // 保存前快照，用于对比生成更新历史
  const oldSnap = {
    name: p.name, summary: p.summary || "", customer: p.customer, group: p.group, productLine: p.productLine, odmFactory: p.odmFactory,
    app: p.app, proposalDate: p.proposalDate, filingDate: p.filingDate, startDate: p.startDate, dueDate: p.dueDate,
    priority: p.priority, signal: p.signal, signalNote: p.signalNote, chips: normalizeChips(p.chips).join("、"),
    status: p.status, statusDesc: p.statusDesc, hwOwner: p.hwOwner, swOwner: p.swOwner, pm: p.pm,
    tags: normalizeChips(p.tags).join("、"),
    participants: normalizeChips(p.participants).join("、"),
    marketExpectation: p.marketExpectation, isProductionMaintenance: PROJECT_DB.isProductionMaintenance(p), stages: PROJECT_DB.normalizeStages(p.stages),
    detailNote: p.detailNote || ""
  };

  p.name         = $("#f-name").value.trim() || p.name;
  p.summary      = normalizeMultilineText($("#f-summary").value);
  p.customer     = $("#f-customer").value.trim() || "-";
  p.group        = $("#f-group").value || "";
  p.productLine  = comboValue("f-productline-sel", "f-productline");
  p.odmFactory   = comboValue("f-odm-sel", "f-odm");
  p.app          = comboValue("f-app-sel", "f-app");
  p.proposalDate = $("#f-proposal").value || "-";
  p.filingDate   = $("#f-filing").value || "-";
  p.startDate    = $("#f-start").value || "-";
  p.dueDate      = $("#f-due").value || "-";
  // 一旦启动日期定了，预计结案日期必填
  if (p.startDate && p.startDate !== "-" && (!p.dueDate || p.dueDate === "-")) {
    showToast("已设置启动日期，预计结案日期不能为空", 2400); $("#f-due").focus(); return;
  }
  p.priority     = $("#f-priority").value;
  p.signal       = $("#f-signal").value;
  p.signalNote   = $("#f-signalnote").value.trim();
  p.chips        = selectedChipNames.slice();
  p.status       = $("#f-status").value;
  p.isProductionMaintenance = p.status === "已结案" && !!$("#f-production-maintenance").checked;
  p.hwOwner      = $("#f-hw").value || "-";
  p.swOwner      = $("#f-sw").value || "-";
  p.pm           = $("#f-pm").value || "-";
  p.participants = [...document.querySelectorAll("#f-participants ~ .person-value, [data-target=\"f-participants\"] .person-value")].map(i => i.value).filter(v => v && v !== "-");
  p.tags         = $("#f-tags").value.split(/[、,，]/).map(s => s.trim()).filter(v => v);
  const nextStatusDesc = normalizeMultilineText($("#f-statusdesc").value);
  const statusDescChanged = PROJECT_DB.updateStatusDescription(p, nextStatusDesc);
  p.marketExpectation = $("#f-market").value.trim();
  p.detailNote   = $("#f-detailnote").value.trim();
  collectStages(p);

  // 生成更新历史：字段 / 状态 / 阶段等任何变更都记录
  const changes = [];
  const FIELDS = [
    ["name", "项目名称"], ["summary", "项目简介"], ["customer", "客户"], ["group", "分组"], ["productLine", "产品线"], ["odmFactory", "ODM 工厂"],
    ["app", "配套 APP"], ["proposalDate", "提案日期"], ["filingDate", "立案日期"], ["startDate", "启动日期"], ["dueDate", "预计结案日期"],
    ["priority", "优先级"], ["signal", "信号灯"], ["signalNote", "信号灯备注"],
    ["hwOwner", "硬件负责人"], ["swOwner", "软件负责人"], ["pm", "项目经理"], ["marketExpectation", "市场预期"], ["detailNote", "项目详情备注"]
  ];
  FIELDS.forEach(([k, label]) => {
    const a = oldSnap[k], b = p[k];
    if (display(a) !== display(b)) changes.push(`${label}：${display(a)} → ${display(b)}`);
  });
  const aChips = oldSnap.chips, bChips = normalizeChips(p.chips).join("、");
  if (aChips !== bChips) changes.push(`核心芯片：${aChips || "-"} → ${bChips || "-"}`);
  if (oldSnap.tags !== normalizeChips(p.tags).join("、")) changes.push(`项目标签：${oldSnap.tags || "-"} → ${normalizeChips(p.tags).join("、") || "-"}`);
  if (oldSnap.participants !== normalizeChips(p.participants).join("、")) changes.push(`参与人：${oldSnap.participants || "-"} → ${normalizeChips(p.participants).join("、") || "-"}`);
  if (oldSnap.status !== p.status) {
    let t = `状态：${oldSnap.status} → ${p.status}`;
    if (p.status === "已结案") t += "（归档至已结案看板）";
    else if (oldSnap.status === "已结案") t += "（移回进行中看板）";
    changes.push(t);
  }
  if (oldSnap.isProductionMaintenance !== p.isProductionMaintenance) {
    changes.push(`量产维护：${p.isProductionMaintenance ? "已开启（移至量产维护看板）" : "已关闭（移回已结案看板）"}`);
  }
  if (display(oldSnap.statusDesc) !== display(p.statusDesc)) changes.push(`状态描述：${p.statusDesc || "-"}`);
  const newStages = PROJECT_DB.normalizeStages(p.stages);
  newStages.forEach((s, i) => {
    const name = PROJECT_DB.STAGES[i].name;
    const o = oldSnap.stages[i];
    if (o.done !== s.done) changes.push(`阶段「${name}」：${o.done ? "已完成" : "未完成"} → ${s.done ? "已完成" : "未完成"}`);
    // 预期天数：空值视为中位默认值，避免默认填充被误报为变更
    const omid = String(PROJECT_DB.STAGES[i].mid);
    const oDays = o.days || omid, sDays = s.days || omid;
    if (oDays !== sDays) changes.push(`阶段「${name}」预期天数：${oDays} → ${sDays}`);
  });
  if (changes.length) {
    p.statusHistory = normalizeHistory(p.statusHistory);
    p.statusHistory.push({ date: todayTimeStr(), text: changes.join("；") });
  }

  // 写回共享存储（列表页下次加载即可看到）
  PROJECT_DB.save(projects);
  if (statusDescChanged) $("#statusdesc-saved").textContent = "最近保存：" + p.statusDescUpdatedAt;

  // 刷新头部（状态/优先级可能变化）与项目阶段
  renderHead(p);
  renderForm(p);
  renderRiskChangeTab(p);
  $("#pane-stages").innerHTML = renderStages(p);
  $("#pane-history").innerHTML = renderHistory(p);
  $("#pane-nodes").innerHTML = renderNodes(p);
  $("#pane-custnodes").innerHTML = renderCustomerNodes(p);

  // 状态切换 → 看板归档 / 移回提示
  let msg = "已保存";
  let dur = 1600;
  if (oldStatus !== p.status && p.status === "已结案") {
    msg = "已保存 · 项目已归档至「已结案看板」";
    dur = 2600;
  } else if (oldStatus === "已结案" && p.status !== "已结案") {
    msg = "已保存 · 项目已移回「进行中看板」";
    dur = 2600;
  }
  showToast(msg, dur);
}

// ---- 新建项目 ----
function createProject() {
  const name = $("#f-name").value.trim();
  if (!name) { showToast("请填写项目名称", 2200); $("#f-name").focus(); return; }
  const startDate = $("#f-start").value;
  const dueDate = $("#f-due").value;
  // 一旦启动日期定了，预计结案日期必填
  if (startDate && !dueDate) { showToast("已设置启动日期，预计结案日期不能为空", 2400); $("#f-due").focus(); return; }
  // 收集首次保存前在“项目阶段”标签中编辑的表单值。
  collectStages(draftProject);
  const draftHistory = normalizeHistory(draftProject && draftProject.statusHistory);

  const p = {
    id: PROJECT_DB.nextId(projects),
    name,
    summary: normalizeMultilineText($("#f-summary").value),
    customer:     $("#f-customer").value.trim() || "-",
    group:        $("#f-group").value || "",
    productLine:  comboValue("f-productline-sel", "f-productline"),
    odmFactory:   comboValue("f-odm-sel", "f-odm"),
    app:          comboValue("f-app-sel", "f-app"),
    proposalDate: $("#f-proposal").value || "-",
    filingDate:   $("#f-filing").value || "-",
    startDate:    startDate || "-",
    dueDate:      dueDate || "-",
    priority:     $("#f-priority").value,
    signal:       $("#f-signal").value,
    signalNote:   $("#f-signalnote").value.trim(),
    chips:        selectedChipNames.slice(),
    status:       $("#f-status").value,
    isProductionMaintenance: $("#f-status").value === "已结案" && !!$("#f-production-maintenance").checked,
    hwOwner:      $("#f-hw").value || "-",
    swOwner:      $("#f-sw").value || "-",
    pm:           $("#f-pm").value || "-",
    participants: [...document.querySelectorAll('[data-target="f-participants"] .person-value')].map(i => i.value).filter(v => v && v !== "-"),
    tags:         $("#f-tags").value.split(/[、,，]/).map(s => s.trim()).filter(v => v),
    statusDesc:   normalizeMultilineText($("#f-statusdesc").value),
    statusDescUpdatedAt: normalizeMultilineText($("#f-statusdesc").value) ? todayTimeStr() : "",
    statusDescHistory: normalizeMultilineText($("#f-statusdesc").value) ? [{ date: todayTimeStr(), text: normalizeMultilineText($("#f-statusdesc").value) }] : [],
    statusDescLegacyHistoryCount: 0,
    marketExpectation: $("#f-market").value.trim(),
    detailNote:   $("#f-detailnote").value.trim(),
    stages:       PROJECT_DB.normalizeStages(draftProject && draftProject.stages),
    risks:        (draftProject && draftProject.risks) || [],
    changes:      (draftProject && draftProject.changes) || [],
    delays:       (draftProject && draftProject.delays) || [],
    flowLinks:    (draftProject && draftProject.flowLinks) || [],
    milestones:   (draftProject && draftProject.milestones) || [],
    isDelayed: false,
    nodes:        PROJECT_DB.normalizeNodes(draftProject && draftProject.nodes),
    customerNodes: PROJECT_DB.normalizeCustomerNodes(draftProject && draftProject.customerNodes),
    createdAt:    todayTimeStr(),
    lastCheckAt:  Date.now(),
    statusHistory: [{ date: todayTimeStr(), text: `项目创建，进入「${$("#f-status").value}」状态` }, ...draftHistory]
  };
  projects.push(p);
  PROJECT_DB.save(projects);

  // 切换为编辑模式（URL 同步，不刷新页面）
  isNewMode = false;
  currentProject = p;
  try { history.replaceState(null, "", `?id=${p.id}`); } catch (e) { /* file:// 下可能受限，忽略 */ }

  showToast("项目已创建", 2200);
}

// ---- 删除项目 ----
function deleteProject() {
  const p = currentProject;
  if (!p || isNewMode) return;
  if (!confirm(`确定删除项目「${p.name}」？\n删除后不可恢复（可先在列表页导出备份）。`)) return;

  returnToSourceList();
}

  t.classList.add("show");

   ========================================================================== */
let isNewMode = false;
let draftProject = null; // 新建模式下暂存的风险/变更/延期等数据，创建项目时带入

// 浏览/管理模式：浏览模式为只读（默认），管理模式才可编辑
const MODE_KEY = "hw_project_board_mode";
let readOnly = true;
try { readOnly = localStorage.getItem(MODE_KEY) !== "manage"; } catch (e) { readOnly = true; }
function applyReadOnly() {
  const foot = $("#detail-foot");
  if (foot) foot.style.display = readOnly ? "none" : "";
  const banner = $("#readonly-banner");
  if (banner) banner.style.display = readOnly ? "" : "none";
  if (readOnly) {
    document.querySelectorAll("#detail-panel input, #detail-panel select, #detail-panel textarea, #detail-panel button").forEach(el => {
      if (!el.closest("#readonly-banner") && !el.closest(".detail-tabs") && !el.closest(".flow-toolbar") && !el.closest(".pf-toggle")) el.disabled = true;
    });
  }
}

// 填充客户 / 工程师建议（datalist，输入框可自由输入；产品线 / ODM / APP 已改为下拉组合控件）
function fillDatalists() {
  $("#dl-customers").innerHTML = PROJECT_DB.loadCustomers()
    .map(c => `<option value="${esc(c.name)}">`).join("");
  $("#dl-engineers").innerHTML = PROJECT_DB.loadEngineers()
    .map(e => `<option value="${esc(e.name)}">`).join("");
  $("#dl-tags").innerHTML = PROJECT_DB.loadTags()
    .map(t => `<option value="${esc(t.name)}">`).join("");
}

function init() {
  fillDatalists();
  const idParam = new URLSearchParams(window.location.search).get("id");
  // 支持 ?tab=stages/nodes/... 直达对应 tab（如项目状态简要页点击阶段跳转）
  const tabParam = new URLSearchParams(window.location.search).get("tab");
  const initialTab = ["info", "stages", "nodes", "flow", "custnodes", "risk", "history"].includes(tabParam) ? tabParam : "info";

  // 新建项目模式：空白表单，保存即创建
  if (idParam === "new") {
    isNewMode = true;
    const draft = {
      id: 0, name: "", customer: "", group: "", productLine: "", odmFactory: "", app: "",
      proposalDate: "", filingDate: "", startDate: "", dueDate: "",
      chips: [], status: "提案中", statusDesc: "",
      priority: "中", signal: "绿灯", signalNote: "",
      statusHistory: [], hwOwner: "", swOwner: "", pm: "李经理", marketExpectation: "", detailNote: "", risks: [], changes: [], delays: [], flowLinks: [], milestones: [], isDelayed: false, nodes: [], customerNodes: [], participants: [], stages: PROJECT_DB.normalizeStages(null)
    };
    draftProject = draft;
    $("#detail-panel").style.display = "block";
    renderHead(draft);
    renderForm(draft);
    renderRiskChangeTab(draft);
    $("#pane-stages").innerHTML = renderStages(draft);
    $("#pane-history").innerHTML = renderHistory(draft);
    $("#pane-nodes").innerHTML = renderNodes(draft);
    $("#pane-custnodes").innerHTML = renderCustomerNodes(draft);
    switchTab(initialTab);
    $("#save-btn").textContent = "保存新建";
    $("#del-btn").style.display = "none";
    $(".save-hint").textContent = "保存后项目将进入「进行中看板」（新建默认为提案中）";
    applyReadOnly();
    if (!readOnly) $("#f-name").focus();
    return;
  }

  const id = parseInt(idParam, 10);
  currentProject = projects.find(p => p.id === id);

  if (!currentProject) {
    $("#detail-panel").style.display = "none";
    $("#not-found").style.display = "block";
    if (isNaN(id)) {
      $("#not-found-text").textContent = "未指定项目 ID，请从列表页点击项目卡片进入详情。";
    }
    return;
  }

  // 打开项目即视为一次 check（项目经理需打开项目 check 一遍；浏览只读模式下不记录）
  if (!readOnly) {
    currentProject.lastCheckAt = Date.now();
    PROJECT_DB.save(projects);
  }

  $("#detail-panel").style.display = "block";
  renderHead(currentProject);
  renderForm(currentProject);
  renderRiskChangeTab(currentProject);
  $("#pane-stages").innerHTML = renderStages(currentProject);
  $("#pane-history").innerHTML = renderHistory(currentProject);
  $("#pane-nodes").innerHTML = renderNodes(currentProject);
  $("#pane-custnodes").innerHTML = renderCustomerNodes(currentProject);
  switchTab(initialTab);
  applyReadOnly();
}

/* ==========================================================================
   事件绑定
   ========================================================================== */
// 来源看板视图：保留提案中/暂缓、进行中、已结案、量产维护四种来源
const fromParam = new URLSearchParams(window.location.search).get("from");
const fromView = ["proposal", "active", "closed", "maintenance"].includes(fromParam) ? fromParam : "active";
const DETAIL_RETURN_CONTEXT_KEY = "hw_project_board_detail_return_context";
function getDetailReturnContext() {
  try {
    const context = JSON.parse(sessionStorage.getItem(DETAIL_RETURN_CONTEXT_KEY) || "null");
    const projectId = new URLSearchParams(location.search).get("id");
    return context && String(context.projectId) === String(projectId) ? context : null;
  } catch (error) {
    return null;
  }
}
function returnToSourceList() {
  const context = getDetailReturnContext();
  if (context && history.length > 1) {
    history.back();
    return;
  }
  location.href = context?.url || ("GeekDash.html?view=" + fromView);
}

$("#back-btn").addEventListener("click", () => {
  // 新建模式未保存时提示放弃
  if (isNewMode && $("#f-name").value.trim()) {
    if (!confirm("新建项目尚未保存，确定放弃并返回列表？")) return;
  }
  returnToSourceList();
});
$("#save-btn").addEventListener("click", saveDetail);
$("#del-btn").addEventListener("click", deleteProject);
document.querySelectorAll(".dtab").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

// 阶段操作：里程碑完成 / 中途结案 / 确定 / 取消 / 保存阶段修改（事件委托）
$("#pane-stages").addEventListener("click", e => {
  if (readOnly) return;
  const rollback = e.target.closest(".stage-rollback");
  if (rollback) { openStageRollback(Number(rollback.dataset.idx)); return; }
  if (e.target.closest(".stage-reopen")) { openStageRollback(); return; }
  // 里程碑完成：展开评述表单
  const doneBtn = e.target.closest(".choice-done");
  if (doneBtn) {
    const form = doneBtn.closest(".stage-card").querySelector(".stage-choice-form");
    const ta = form.querySelector(".choice-note");
    ta.placeholder = "填写里程碑完成评述";
    ta.value = "";
    form.dataset.mode = "done";
    form.style.display = "";
    ta.focus();
    return;
  }
  // 中途结案：展开结案理由表单
  const closeBtn = e.target.closest(".choice-close");
  if (closeBtn) {
    const form = closeBtn.closest(".stage-card").querySelector(".stage-choice-form");
    const ta = form.querySelector(".choice-note");
    ta.placeholder = "填写中途结案理由";
    ta.value = "";
    form.dataset.mode = "close";
    form.style.display = "";
    ta.focus();
    return;
  }
  // 取消
  if (e.target.closest(".choice-cancel")) {
    e.target.closest(".choice-cancel").closest(".stage-choice-form").style.display = "none";
    return;
  }
  // 确定
  const confirmBtn = e.target.closest(".choice-confirm");
  if (confirmBtn) {
    const form = confirmBtn.closest(".stage-choice-form");
    const idx = parseInt(form.dataset.idx, 10);
    const mode = form.dataset.mode;
    const text = form.querySelector(".choice-note").value.trim();
    if (mode === "done") {
      if (!text) { showToast("请填写里程碑完成评述", 2000); return; }
      confirmStageDone(idx, text);
    } else if (mode === "close") {
      if (!text) { showToast("请填写中途结案理由", 2000); return; }
      confirmStageClose(text);
    }
    return;
  }
  // 保存阶段修改
  if (e.target.closest("#stage-save-btn")) saveDetail();
});

// 项目节点：新增 / 确认 / 取消 / 删除（事件委托）
$("#pane-nodes").addEventListener("click", e => {
  if (e.target.closest("#node-add")) {
    openNodeForm(null);
    return;
  }
  if (e.target.closest("#node-cancel")) {
    $("#node-form").style.display = "none";
    editingNodeId = null;
    return;
  }
  if (e.target.closest("#node-confirm")) {
    saveNode();
    return;
  }
  const edit = e.target.closest(".node-edit");
  if (edit) {
    const id = parseInt(edit.dataset.id, 10);
    const node = PROJECT_DB.normalizeNodes(currentProject.nodes).find(n => n.id === id);
    openNodeForm(node);
    return;
  }
  const del = e.target.closest(".node-del");
  if (del) {
    if (confirm("确定删除该节点？")) deleteNode(parseInt(del.dataset.id, 10));
    return;
  }
});

// 客户项目节点：新增 / 确认 / 取消 / 编辑 / 删除（事件委托）
$("#pane-custnodes").addEventListener("click", e => {
  if (e.target.closest("#custnode-add")) {
    openCustomerNodeForm(null);
    return;
  }
  if (e.target.closest("#custnode-cancel")) {
    $("#custnode-form").style.display = "none";
    editingCustNodeId = null;
    return;
  }
  if (e.target.closest("#custnode-confirm")) {
    saveCustomerNode();
    return;
  }
  const edit = e.target.closest(".node-edit");
  if (edit) {
    const id = parseInt(edit.dataset.id, 10);
    const node = PROJECT_DB.normalizeCustomerNodes(currentProject.customerNodes).find(n => n.id === id);
    openCustomerNodeForm(node);
    return;
  }
  const del = e.target.closest(".node-del");
  if (del) {
    if (confirm("确定删除该节点？")) deleteCustomerNode(parseInt(del.dataset.id, 10));
    return;
  }
});

// 核心芯片受控选择 / 刷新 / 移除
document.addEventListener("click", e => {
  if (e.target.closest("#chip-select-add")) {
    const select = $("#chip-select");
    const value = select && select.value;
    if (!value) { showToast("请先选择芯片型号", 1800); return; }
    selectedChipNames = canonicalChipSelection(selectedChipNames.concat(value));
    renderChipPickerState();
    return;
  }
  if (e.target.closest("#chip-refresh")) {
    refreshChipCatalog(true);
    return;
  }
  const chipRemove = e.target.closest(".project-chip-remove");
  if (chipRemove) {
    const key = PROJECT_DB.chipNameKey(chipRemove.dataset.chipName);
    selectedChipNames = selectedChipNames.filter(name => PROJECT_DB.chipNameKey(name) !== key);
    renderChipPickerState();
    return;
  }
});

// 从新窗口维护基础芯片后，回到详情页即刷新选项并保留当前草稿。
window.addEventListener("focus", () => {
  if ($("#chip-picker")) refreshChipCatalog(false);
});

// 风险预警：新增 / 解除（事件委托）
document.addEventListener("click", e => {
  if (readOnly) return;
  const edit = e.target.closest(".risk-edit");
  if (edit) {
    const p = isNewMode ? draftProject : currentProject;
    const risk = PROJECT_DB.normalizeRisks(p.risks).find(r => r.id === Number(edit.dataset.id));
    if (!risk) return;
    editingRiskId = risk.id;
    $("#risk-form").style.display = "";
    $("#risk-note").value = risk.content;
    $("#risk-method-field").style.display = risk.resolved ? "" : "none";
    $("#risk-method").value = risk.resolveMethod;
    $("#risk-confirm").textContent = "保存修改";
    document.querySelectorAll("#risk-level-select .rlv-btn").forEach(b => b.classList.toggle("active", b.dataset.level === risk.level));
    $("#risk-note").focus();
    return;
  }
  // 展开新增风险预警表单
  if (e.target.closest("#risk-add")) {
    editingRiskId = null;
    $("#risk-confirm").textContent = "确认增加";
    $("#risk-method-field").style.display = "none";
    const form = $("#risk-form");
    form.style.display = "";
    $("#risk-note").value = "";
    $("#risk-note").focus();
    // 重置等级为「中」
    document.querySelectorAll("#risk-level-select .rlv-btn").forEach(b => b.classList.toggle("active", b.dataset.level === "中"));
    return;
  }
  // 选择风险等级
  if (e.target.closest("#risk-level-select .rlv-btn")) {
    const btn = e.target.closest("#risk-level-select .rlv-btn");
    document.querySelectorAll("#risk-level-select .rlv-btn").forEach(b => b.classList.toggle("active", b === btn));
    return;
  }
  // 确认新增风险预警
  if (e.target.closest("#risk-confirm")) {
    const content = $("#risk-note").value.trim();
    if (!content) { showToast("请填写风险预警信息", 2000); return; }
    const levelBtn = document.querySelector("#risk-level-select .rlv-btn.active");
    const level = levelBtn ? levelBtn.dataset.level : "中";
    const risk = PROJECT_DB.normalizeRisks((isNewMode ? draftProject : currentProject).risks).find(r => r.id === editingRiskId);
    const method = $("#risk-method").value.trim();
    if (risk && risk.resolved && !method) { showToast("请填写解除方法", 2000); return; }
    addRisk(content, level, method);
    return;
  }
  // 取消新增
  if (e.target.closest("#risk-form .risk-cancel")) {
    editingRiskId = null;
    $("#risk-form").style.display = "none";
    $("#risk-note").value = "";
    return;
  }
  // 展开解除表单
  const resolveBtn = e.target.closest(".risk-resolve-btn");
  if (resolveBtn) {
    const id = parseInt(resolveBtn.dataset.id, 10);
    const form = document.querySelector(`.risk-resolve-form[data-id="${id}"]`);
    if (form) { form.style.display = ""; form.querySelector(".risk-resolve-note").focus(); }
    return;
  }
  // 确认解除
  const resolveConfirm = e.target.closest(".risk-resolve-confirm");
  if (resolveConfirm) {
    const id = parseInt(resolveConfirm.dataset.id, 10);
    const form = resolveConfirm.closest(".risk-resolve-form");
    const method = form.querySelector(".risk-resolve-note").value.trim();
    if (!method) { showToast("请填写解除方法", 2000); return; }
    resolveRisk(id, method);
    return;
  }
  // 取消解除
  if (e.target.closest(".risk-resolve-cancel")) {
    e.target.closest(".risk-resolve-cancel").closest(".risk-resolve-form").style.display = "none";
    return;
  }
});

// 项目需求变更：新增（事件委托）
document.addEventListener("click", e => {
  if (readOnly) return;
  const edit = e.target.closest(".change-edit");
  if (edit) {
    const p = isNewMode ? draftProject : currentProject;
    const change = PROJECT_DB.normalizeChanges(p.changes).find(c => c.id === Number(edit.dataset.id));
    if (!change) return;
    editingChangeId = change.id;
    $("#chg-form").style.display = "";
    $("#chg-content").value = change.content;
    $("#chg-reason").value = change.reason;
    $("#chg-source").value = change.source;
    document.querySelectorAll('input[name="chg-status"]').forEach(input => input.checked = input.value === change.status);
    $("#chg-confirm").textContent = "保存修改";
    $("#chg-content").focus();
    return;
  }
  // 展开新增需求变更表单
  if (e.target.closest("#change-add")) {
    editingChangeId = null;
    $("#chg-confirm").textContent = "确认增加";
    $("#chg-form").style.display = "";
    $("#chg-content").value = "";
    $("#chg-reason").value = "";
    $("#chg-source").value = "客户";
    document.querySelector('input[name="chg-status"][value="接受"]').checked = true;
    $("#chg-content").focus();
    return;
  }
  // 确认新增需求变更
  if (e.target.closest("#chg-confirm")) {
    const source = $("#chg-source").value;
    const content = $("#chg-content").value.trim();
    const statusEl = document.querySelector('input[name="chg-status"]:checked');
    const status = statusEl ? statusEl.value : "接受";
    const reason = $("#chg-reason").value.trim();
    if (!content) { showToast("请填写变更内容", 2000); return; }
    if (!reason) { showToast("请填写理由（接受或拒绝均需填写）", 2200); return; }
    addChange(source, content, status, reason);
    return;
  }
  // 取消新增
  if (e.target.closest("#chg-cancel")) {
    editingChangeId = null;
    $("#chg-form").style.display = "none";
    return;
  }
});

// 延期项目控制：新增 / 编辑 / 删除延期记录（事件委托）
document.addEventListener("click", e => {
  // 展开新增延期表单（重置为新增模式）
  if (e.target.closest("#delay-add")) {
    editingDelayId = null;
    const p = isNewMode ? draftProject : currentProject;
    const cnt = p ? PROJECT_DB.normalizeDelays(p.delays).length : 0;
    $("#delay-form").style.display = "";
    $("#delay-reason").value = "";
    $("#delay-target").value = "";
    $("#delay-measures").value = "";
    $("#delay-form-title").textContent = "新增延期" + (cnt + 1);
    $("#delay-confirm").textContent = "确认增加";
    $("#delay-reason").focus();
    return;
  }
  // 编辑 / 删除延期记录
  const op = e.target.closest(".delay-op-btn");
  if (op) {
    const id = parseInt(op.dataset.id, 10);
    if (op.dataset.act === "edit") openDelayEdit(id);
    else if (op.dataset.act === "del") removeDelay(id);
    return;
  }
  // 确认新增 / 编辑延期
  if (e.target.closest("#delay-confirm")) {
    const reason = $("#delay-reason").value.trim();
    const target = $("#delay-target").value;
    const measures = $("#delay-measures").value.trim();
    if (!reason && !target && !measures) { showToast("请至少填写延期原因、新目标完成日期或应对措施之一", 2400); return; }
    addDelay(reason, target, measures);
    return;
  }
  // 取消新增 / 编辑
  if (e.target.closest("#delay-cancel")) {
    editingDelayId = null;
    $("#delay-form").style.display = "none";
    return;
  }
});

/* ---- 主题切换（与列表页共享同一 localStorage key） ---- */
const THEME_KEY = "hw_project_board_theme";
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* 忽略 */ }
  document.querySelectorAll("#theme-switch button").forEach(b => b.classList.toggle("active", b.dataset.theme === t));
}
let theme;
try { theme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) { theme = "dark"; }
$("#theme-switch").addEventListener("click", e => {
  const b = e.target.closest("button[data-theme]");
  if (b) applyTheme(b.dataset.theme);
});
applyTheme(theme);

init();

/* ---- 日期专区：当前日期 / 星期 / 时刻 / 距年底倒计时 ---- */
const WEEK_CN = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
function updateDateZone() {
  const now = new Date();
  const y = now.getFullYear();
  const dateEl = $("#dz-date"), weekEl = $("#dz-week"), timeEl = $("#dz-time"), cdEl = $("#dz-cd-num");
  if (dateEl) dateEl.textContent = y + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";
  if (weekEl) weekEl.textContent = WEEK_CN[now.getDay()];
  if (timeEl) timeEl.textContent = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
  if (cdEl) {
    const endOfYear = new Date(y, 11, 31);
    const todayStart = new Date(y, now.getMonth(), now.getDate());
    cdEl.textContent = String(Math.max(0, Math.round((endOfYear - todayStart) / 86400000)));
  }
}
updateDateZone();
setInterval(updateDateZone, 1000);
</script>

<div class="modal-overlay" id="pf-node-overlay" style="display:none">
  <div class="flow-modal">
    <div class="flow-modal-head">
      <span class="title" id="pfn-title">编辑节点</span>
      <button class="flow-modal-close" id="pfn-close" type="button">×</button>
    </div>
    <div class="flow-modal-body">
      <div class="field"><label>节点名称 *</label><input type="text" id="pfn-name" placeholder="如：EVT 全功能送测"></div>
      <div class="field"><label>目标完成日期</label><input type="date" id="pfn-target"></div>
      <div class="field"><label>实际完成日期</label><input type="date" id="pfn-done"></div>
      <div class="field"><label>输出成果 *</label><textarea id="pfn-output" placeholder="填写该节点的输出成果"></textarea></div>
      <div class="field"><label>前置节点（连入本节点）</label><select id="pfn-prev"></select></div>
      <div class="field"><label>后置节点（本节点连出）</label><select id="pfn-next"></select></div>
      <div class="node-form-hint">填写「实际完成日期」并保存，表示该节点已完成；连线也可直接在画布上拖拽节点圆点完成。</div>
    </div>
    <div class="flow-modal-foot">
      <button class="btn primary" id="pfn-save" type="button">保存</button>
      <button class="btn" id="pfn-cancel" type="button">取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay pf-preview-overlay" id="pf-preview-overlay" style="display:none">
  <div class="pf-preview-box">
    <div class="pf-preview-head">
      <span class="title" id="pf-preview-title">项目阶段节点图</span>
      <button class="flow-modal-close pf-preview-close" type="button">×</button>
    </div>
    <div class="pf-preview-body"><img id="pf-preview-img" alt="项目阶段节点图"></div>
    <div class="pf-preview-foot">
      <button class="btn primary" id="pf-preview-download" type="button">下载 PNG</button>
      <button class="btn pf-preview-close" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="flow-print-area" id="flow-print-area"></div>
</body>
</html>
